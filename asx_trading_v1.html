<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Trading Assistant</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f8f7;
    --bg-tertiary: #f1f0ec;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9b9b9b;
    --border-light: rgba(0,0,0,0.10);
    --border-medium: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1c1c;
      --bg-secondary: #242424;
      --bg-tertiary: #2a2a2a;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-tertiary: #666666;
      --border-light: rgba(255,255,255,0.08);
      --border-medium: rgba(255,255,255,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; font-size: 14px; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 220px; flex-shrink: 0; background: var(--bg-primary); border-right: 0.5px solid var(--border-light); display: flex; flex-direction: column; padding: 1.25rem 0; overflow-y: auto; }
  .sidebar-logo { padding: 0 1.25rem 1.5rem; border-bottom: 0.5px solid var(--border-light); margin-bottom: 1rem; }
  .sidebar-logo h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .sidebar-logo p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .nav-section { padding: 0 0.75rem; margin-bottom: 0.75rem; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 0.5rem; margin-bottom: 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius-md); cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; margin-bottom: 1px; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
  .nav-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .nav-item.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 500; }
  .nav-icon { font-size: 13px; width: 18px; text-align: center; }
  .server-indicator { margin: auto 1.25rem 0; padding-top: 1rem; border-top: 0.5px solid var(--border-light); }
  .server-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .server-dot.ok { background: #22c55e; }
  .server-dot.err { background: #ef4444; }
  .server-dot.checking { background: #f59e0b; animation: pulse 1s infinite; }

  /* Main */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.5rem; background: var(--bg-primary); border-bottom: 0.5px solid var(--border-light); flex-shrink: 0; gap: 12px; }
  .topbar h2 { font-size: 15px; font-weight: 600; }
  .market-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border-medium); color: var(--text-secondary); white-space: nowrap; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .content { padding: 1.5rem; flex: 1; }

  /* Cards */
  .card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.25rem; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.875rem; text-transform: uppercase; letter-spacing: 0.6px; }

  /* Metrics */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .metric-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 1rem; }
  .metric-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .metric-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

  /* Grid layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text-secondary); border-bottom: 0.5px solid var(--border-light); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 0.5px solid var(--border-light); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-secondary); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-buy  { background: #dcfce7; color: #15803d; }
  .badge-sell { background: #fee2e2; color: #b91c1c; }
  .badge-hold { background: #fef9c3; color: #854d0e; }
  .badge-trim { background: #ffedd5; color: #c2410c; }
  .badge-topup{ background: #dbeafe; color: #1d4ed8; }
  .badge-executed { background: #dbeafe; color: #1d4ed8; }
  .badge-skipped { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-open { background: #dbeafe; color: #1d4ed8; }
  .badge-closed { background: var(--bg-secondary); color: var(--text-secondary); }
  .badge-neutral { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  @media (prefers-color-scheme: dark) {
    .badge-buy  { background: #14532d; color: #86efac; }
    .badge-sell { background: #7f1d1d; color: #fca5a5; }
    .badge-hold { background: #713f12; color: #fde68a; }
    .badge-trim { background: #7c2d12; color: #fed7aa; }
    .badge-topup{ background: #1e3a5f; color: #93c5fd; }
    .badge-executed { background: #1e3a5f; color: #93c5fd; }
    .badge-pending { background: #451a03; color: #fde68a; }
    .badge-open { background: #1e3a5f; color: #93c5fd; }
  }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-md); border: 0.5px solid var(--border-medium); background: transparent; color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: var(--font); white-space: nowrap; }
  .btn:hover { background: var(--bg-secondary); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
  .btn-primary:hover { opacity: 0.85; background: var(--text-primary); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { border-color: #ef4444; color: #ef4444; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-success { border-color: #22c55e; color: #15803d; }
  .btn-success:hover { background: #dcfce7; }

  /* Bars */
  .conf-bar { width: 80px; height: 5px; border-radius: 3px; background: var(--bg-secondary); overflow: hidden; display: inline-block; vertical-align: middle; }
  .conf-fill { height: 100%; border-radius: 3px; }
  .gauge-bar { height: 8px; border-radius: 4px; background: var(--bg-secondary); overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

  /* Indicator panel */
  .ind-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 0.5px solid var(--border-light); font-size: 12px; }
  .ind-row:last-child { border-bottom: none; }
  .ind-label { color: var(--text-secondary); }
  .ind-val { font-weight: 600; font-size: 12px; }

  /* Signal chips */
  .signal-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin: 2px; }
  .chip-buy  { background: #dcfce7; color: #15803d; }
  .chip-sell { background: #fee2e2; color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    .chip-buy  { background: #14532d; color: #86efac; }
    .chip-sell { background: #7f1d1d; color: #fca5a5; }
  }

  /* Critical Alert Banner */
  .critical-alert-banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: var(--radius-md); border: 1.5px solid #ef4444; background: #fff1f1; color: #7f1d1d; margin-bottom: 8px; }
  .critical-alert-banner .alert-icon { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
  .critical-alert-banner .alert-body { flex: 1; min-width: 0; }
  .critical-alert-banner .alert-title { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
  .critical-alert-banner .alert-desc  { font-size: 12px; margin-top: 2px; opacity: 0.85; }
  .critical-alert-banner .alert-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  @media (prefers-color-scheme: dark) {
    .critical-alert-banner { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.5); }
  }

  /* SR levels */
  .sr-level { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 3px; }
  .sr-r { background: #fee2e2; color: #b91c1c; }
  .sr-s { background: #dcfce7; color: #15803d; }
  .sr-p { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  @media (prefers-color-scheme: dark) {
    .sr-r { background: #7f1d1d; color: #fca5a5; }
    .sr-s { background: #14532d; color: #86efac; }
  }

  /* Mini chart canvas */
  canvas.sparkline { width: 100%; height: 60px; }
  .chart-container { position: relative; width: 100%; height: 180px; }
  canvas.price-chart { width: 100%; height: 180px; }

  /* Chat */
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 400px; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 12px; }
  .msg { max-width: 88%; padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.6; }
  .msg-user { align-self: flex-end; background: var(--text-primary); color: var(--bg-primary); border-radius: 10px 10px 2px 10px; }
  .msg-ai { align-self: flex-start; background: var(--bg-secondary); border: 0.5px solid var(--border-light); border-radius: 10px 10px 10px 2px; white-space: pre-wrap; }
  .chat-input-row { display: flex; gap: 8px; padding-top: 10px; border-top: 0.5px solid var(--border-light); margin-top: auto; }
  .chat-input-row input { flex: 1; }

  /* Loading */
  .loading-dots { display: inline-flex; gap: 4px; align-items: center; }
  .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); animation: bounce 1.2s infinite; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

  /* Forms */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 1rem; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  input[type="text"], input[type="number"], input[type="password"], textarea, select {
    padding: 7px 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-medium);
    background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 13px; width: 100%;
    transition: border-color 0.15s; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--text-primary); }
  textarea { resize: vertical; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 0.5px solid var(--border-light); }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); transition: all 0.15s; background: none; font-family: var(--font); margin-bottom: -0.5px; }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 500; }
  .tab:hover:not(.active) { color: var(--text-primary); background: var(--bg-secondary); }

  /* Signal row */
  .signal-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border-light); font-size: 13px; }
  .signal-row:last-child { border-bottom: none; }
  .sentiment-bar { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .sentiment-track { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-secondary); overflow: hidden; }
  .sentiment-fill { height: 100%; border-radius: 3px; }

  /* Toast */
  #toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { padding: 10px 14px; background: var(--bg-primary); border: 0.5px solid var(--border-medium); border-radius: var(--radius-md); font-size: 13px; pointer-events: all; animation: slideIn 0.2s ease; max-width: 300px; }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Rec card */
  .rec-card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 10px; }
  .rec-card:hover { border-color: var(--border-medium); }
  .rec-card.executed-card { border-left: 3px solid #3b82f6; }
  .rec-card.skipped-card { border-left: 3px solid var(--border-medium); opacity: 0.65; }

  /* Detail card */
  .detail-section { margin-bottom: 1.25rem; }
  .detail-section:last-child { margin-bottom: 0; }

  /* Color utilities */
  .up { color: #16a34a; } .down { color: #dc2626; }
  .text-success { color: #16a34a; } .text-danger { color: #dc2626; }
  .text-warn { color: #d97706; }
  .text-muted { color: var(--text-secondary); }
  .text-xs { font-size: 11px; color: var(--text-secondary); }
  .text-sm { font-size: 13px; }

  /* Layout utils */
  .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .mt-1 { margin-top: 0.5rem; } .mt-2 { margin-top: 1rem; }
  .mb-1 { margin-bottom: 0.5rem; } .mb-2 { margin-bottom: 1rem; }
  .section-gap { margin-bottom: 1.25rem; }
  .divider { border: none; border-top: 0.5px solid var(--border-light); margin: 1rem 0; }
  code { font-family: monospace; font-size: 12px; background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; }
  pre.code-block { font-family: monospace; font-size: 12px; background: var(--bg-secondary); padding: 12px; border-radius: var(--radius-md); color: var(--text-secondary); line-height: 1.6; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

  /* Empty state */
  .empty-state { text-align: center; padding: 3rem 2rem; }
  .empty-icon { font-size: 36px; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state p { color: var(--text-secondary); font-size: 14px; }
  .empty-state .sub { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }

  /* Schedule pills */
  .schedule-pill { padding: 5px 12px; border-radius: var(--radius-md); font-size: 12px; border: 0.5px solid var(--border-light); color: var(--text-secondary); white-space: nowrap; }
  .schedule-pill.past { border-color: #22c55e; color: #15803d; background: #dcfce7; }
  .schedule-pill.current { border-color: #3b82f6; color: #1d4ed8; background: #dbeafe; }
  @media (prefers-color-scheme: dark) {
    .schedule-pill.past { background: #14532d; color: #86efac; }
    .schedule-pill.current { background: #1e3a5f; color: #93c5fd; }
  }

  .info-banner { background: #fef3c7; border: 0.5px solid #fbbf24; border-radius: var(--radius-md); padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 1rem; }
  @media (prefers-color-scheme: dark) { .info-banner { background: #451a03; color: #fde68a; border-color: #92400e; } }

  .progress-ring { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--border-light); position: relative; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <h1>ASX Trader</h1>
      <p>Decision Support v2.0</p>
    </div>
    <div class="nav-section">
      <div class="nav-label">Overview</div>
      <button class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">⬡</span> Dashboard</button>
      <button class="nav-item" onclick="showPage('portfolio')"><span class="nav-icon">⬢</span> Portfolio</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Analysis</div>
      <button class="nav-item" onclick="showPage('macro')"><span class="nav-icon">◎</span> Morning Macro</button>
      <button class="nav-item" onclick="showPage('recommendations')"><span class="nav-icon">◆</span> Recommendations</button>
      <button class="nav-item" onclick="showPage('signals')"><span class="nav-icon">◇</span> Live Signals</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Records</div>
      <button class="nav-item" onclick="showPage('journal')"><span class="nav-icon">▣</span> Trade Journal</button>
      <button class="nav-item" onclick="showPage('performance')"><span class="nav-icon">▤</span> Performance</button>
      <button class="nav-item" onclick="showPage('history')"><span class="nav-icon">▥</span> Value History</button>
      <button class="nav-item" onclick="showPage('cgt')"><span class="nav-icon">◈</span> CGT Parcels</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Tools</div>
      <button class="nav-item" onclick="showPage('backtest')"><span class="nav-icon">▷</span> Backtesting</button>
      <button class="nav-item" onclick="showPage('assistant')"><span class="nav-icon">◉</span> AI Assistant</button>
      <button class="nav-item" onclick="showPage('settings')"><span class="nav-icon">⊙</span> Settings</button>
    </div>
    <div class="server-indicator">
      <div class="flex-row" style="font-size:11px;color:var(--text-secondary)">
        <span class="server-dot checking" id="srv-dot"></span>
        <span id="srv-label">Connecting...</span>
      </div>
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:3px">localhost:5000 · yfinance</div>
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px" id="db-label">💾 DB: —</div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="flex-row">
        <div class="market-pill"><div class="live-dot"></div><span id="market-time">ASX Loading...</span></div>
        <button class="btn btn-sm" onclick="refreshPrices()">⟳ Refresh Prices</button>
        <button class="btn btn-primary btn-sm" onclick="runAnalysis()">▶ Run Analysis</button>
      </div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const API = 'http://localhost:5000';

// ============================================================
// STATE
// ============================================================
const state = {
  page: 'dashboard',
  portfolio: [
    { ticker: 'CBA',   shares: 50,  avgPrice: 118.20, currentPrice: 124.50, sector: 'Banking' },
    { ticker: 'BHP',   shares: 80,  avgPrice: 43.10,  currentPrice: 45.80,  sector: 'Mining' },
    { ticker: 'TLS',   shares: 200, avgPrice: 3.92,   currentPrice: 4.18,   sector: 'Telecoms' },
    { ticker: 'GMG',   shares: 30,  avgPrice: 33.50,  currentPrice: 36.20,  sector: 'REITs' },
    { ticker: 'HUB24', shares: 25,  avgPrice: 58.00,  currentPrice: 63.40,  sector: 'Fintech' },
    { ticker: 'JBH',   shares: 15,  avgPrice: 67.30,  currentPrice: 71.90,  sector: 'Retail' },
    { ticker: 'SCG',   shares: 180, avgPrice: 3.42,   currentPrice: 3.58,   sector: 'REITs' },
  ],
  cash: 15000,
  recommendations: [],
  tradeJournal: [],
  recHistory: [],
  portfolioHistory: [],
  cgtParcels: [],
  cgtMethod: 'fifo',
  cgtDisposals: [],
  apiUsageCost: null,
  apiCostFetchedAt: null,
  apiCostFetchError: null,
  macroData: null,       // persisted — cleared/replaced only by a new run
  macroDate: null,       // DD-MM-YYYY of last macro run — prevents duplicate daily runs

const fmt = (n, d=2) => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d});

const totalCost      = () => state.portfolio.reduce((s,h)=>s+h.shares*h.avgPrice, 0);

// Deduplicates portfolio by ticker for display (weighted avg cost, summed shares)
function mergedPortfolio() {
  const map = {};
  for (const h of state.portfolio) {
    if (!map[h.ticker]) {
      map[h.ticker] = { ticker: h.ticker, shares: 0, _totalCost: 0, currentPrice: h.currentPrice, sector: h.sector || 'Other' };
    }
    map[h.ticker]._totalCost += h.shares * h.avgPrice;
    map[h.ticker].shares += h.shares;
    // Always take the latest currentPrice (last write wins — refreshPrices sets it uniformly)
    map[h.ticker].currentPrice = h.currentPrice;
    // Prefer any sector that isn't 'Other' or blank
    const incoming = h.sector && h.sector !== 'Other' ? h.sector : null;
    if (incoming && (!map[h.ticker].sector || map[h.ticker].sector === 'Other')) {
      map[h.ticker].sector = incoming;
    }
  }
  return Object.values(map).map(h => ({ ...h, avgPrice: h._totalCost / h.shares }));
}

// ── CRITICAL PRICE-DECLINE ALERT ENGINE ──────────────────────────────────────
// Thresholds:
//   1. Single-day decline ≥15% (flash crash / trading halt risk)
//   2. Consecutive 3-day decline where each day closed lower AND cumulative drop ≥10%
// Data source: chart_data from liveSignals (close prices, last 90 days from backend)
// Called: after each signal refresh; result stored in state.criticalAlerts

function computeCriticalAlerts() {
  const newAlerts = {};
  const signals = state.liveSignals || {};
  const now = Date.now();

  for (const [ticker, s] of Object.entries(signals)) {
    if (s.error || !s.chart_data || s.chart_data.length < 2) continue;
    // Only alert for current portfolio holdings (not watchlist)
    const holding = getPortfolioHolding(ticker);
    if (!holding || holding.shares <= 0) continue;

    const closes = s.chart_data.map(d => d.close).filter(v => v > 0);
    if (closes.length < 2) continue;

    // ── Test 1: Single-day decline ≥15% ───────────────────────────────────────
    const prev = closes[closes.length - 2];
    const curr = closes[closes.length - 1];
    const dayPct = prev > 0 ? ((curr - prev) / prev) * 100 : 0;
    if (dayPct <= -15) {
      newAlerts[ticker] = {
        type: 'single_day',
        pct: dayPct,
        days: 1,
        fromPrice: prev,
        toPrice: curr,
        triggeredAt: newAlerts[ticker]?.triggeredAt || now,
        severity: 'critical',
      };
      continue; // single-day is highest severity; no need to check 3-day
    }

    // ── Test 2: 3 consecutive down days with cumulative decline ≥10% ──────────
    if (closes.length >= 4) {
      const d1 = closes[closes.length - 4]; // open of window
      const d2 = closes[closes.length - 3];
      const d3 = closes[closes.length - 2];
      const d4 = closes[closes.length - 1]; // latest close
      const allDown = d2 < d1 && d3 < d2 && d4 < d3;
      const cumulPct = d1 > 0 ? ((d4 - d1) / d1) * 100 : 0;
      if (allDown && cumulPct <= -10) {
        newAlerts[ticker] = {
          type: 'consecutive',
          pct: cumulPct,
          days: 3,
          fromPrice: d1,
          toPrice: d4,
          triggeredAt: newAlerts[ticker]?.triggeredAt || now,
          severity: cumulPct <= -10 ? 'critical' : 'warning',
        };
      }
    }
  }

  // Merge: preserve triggeredAt for alerts that are continuing
  const merged = {};
  for (const [t, alert] of Object.entries(newAlerts)) {
    const prev = state.criticalAlerts?.[t];
    merged[t] = {
      ...alert,
      triggeredAt: prev?.triggeredAt || alert.triggeredAt,
      // Don't re-dismiss if the alert worsened
      dismissed: prev?.dismissed && prev.pct >= alert.pct,
    };
  }
  state.criticalAlerts = merged;
  return merged;
}

function dismissCriticalAlert(ticker) {
  if (state.criticalAlerts[ticker]) {
    state.criticalAlerts[ticker].dismissed = true;
  }
  if (!state.dismissedAlerts) state.dismissedAlerts = {};
  state.dismissedAlerts[ticker] = Date.now();
  scheduleSave();
  // Re-render whatever page is visible to remove the banner
  renderPage();
}

// ── PARCEL HELPERS ──────────────────────────────────────────
function nextParcelId() {
  // Derive from max existing id every time to survive page reloads safely
  const max = state.cgtParcels.reduce((m,p) => Math.max(m, p.id || 0), 0);
  return max + 1;
}

function addParcel(ticker, date, qty, costPerShare, fees, sector) {
  state.cgtParcels.push({
    id: nextParcelId(),
    ticker: ticker.toUpperCase(),
    date,
    qty,
    remainingQty: qty,
    costPerShare,
    fees,          // buy brokerage for this lot
    sector: sector || 'Other',
  });
}

// Returns parcels for a ticker ordered by the chosen CGT method
function getParcelsForTicker(ticker, method) {
  const open = state.cgtParcels.filter(p => p.ticker === ticker.toUpperCase() && p.remainingQty > 0);
  method = method || state.cgtMethod || 'fifo';
  if (method === 'fifo')     return open.sort((a,b) => parseDate(a.date) - parseDate(b.date));
  if (method === 'lifo')     return open.sort((a,b) => parseDate(b.date) - parseDate(a.date));
  if (method === 'minimise') return open.sort((a,b) => {
    // Minimise CGT: prefer discount-eligible (>12mo) lots first; within same group, sell highest-cost first
    const today = todayStr();
    const aDisc = daysBetween(a.date, today) >= 365;
    const bDisc = daysBetween(b.date, today) >= 365;
    if (aDisc !== bDisc) return aDisc ? -1 : 1;      // discount-eligible first
    return b.costPerShare - a.costPerShare;            // highest cost first (lowest taxable gain)
  });
  if (method === 'maximise') return open.sort((a,b) => b.costPerShare - a.costPerShare); // highest cost first = maximise realised loss (tax-loss harvesting)
  return open.sort((a,b) => parseDate(a.date) - parseDate(b.date));
}

function parseDate(dateStr) {
  if (!dateStr) return null;
  // Handle DD-MM-YYYY format
  if (/^\d{2}-\d{2}-\d{4}$/.test(dateStr)) {
    const [day, month, year] = dateStr.split('-').map(Number);
    return new Date(year, month - 1, day);
  }
  // Fallback to other formats
  return new Date(dateStr);
}

function daysBetween(dateStr1, dateStr2) {
  const date1 = parseDate(dateStr1);
  const date2 = parseDate(dateStr2);
  return Math.floor((date2 - date1) / 86400000);
}

// Match qty against parcels (FIFO/LIFO/etc), record disposals, return {disposals, totalCostBase, totalGrossGain}
function matchSaleAgainstParcels(ticker, saleQty, salePrice, saleDate, saleFees, method) {
  const parcels = getParcelsForTicker(ticker, method);
  let remaining = saleQty;
  const disposals = [];
  // Split fees proportionally across parcels by qty
  const feePerShare = saleFees / saleQty;

  for (const parcel of parcels) {
    if (remaining <= 0) break;
    const matched = Math.min(parcel.remainingQty, remaining);
    const held = daysBetween(parcel.date, saleDate);
    const eligible50 = held >= 365;
    const proceeds = matched * salePrice;
    const costBase = matched * parcel.costPerShare + (parcel.fees * matched / parcel.qty); // pro-rata buy fee
    const allocatedSaleFee = feePerShare * matched;
    const grossGain = proceeds - costBase - allocatedSaleFee;
    const discount = eligible50 && grossGain > 0 ? grossGain * 0.5 : 0;
    const netGain = grossGain - discount;

    disposals.push({
      saleDate,
      ticker: ticker.toUpperCase(),
      salePrice,
      saleQty: matched,
      parcelId: parcel.id,
      parcelDate: parcel.date,
      parcelCostPerShare: parcel.costPerShare,
      heldDays: held,
      eligible50,
      proceeds,
      costBase,
      saleFee: allocatedSaleFee,
      grossGain,
      discount,
      netGain,
    });

    parcel.remainingQty -= matched;
    remaining -= matched;
  }

  // If no parcels exist (e.g. pre-app position) fall back to avgPrice
  if (remaining > 0) {
    const holding = getPortfolioHolding(ticker);
    const costPerShare = holding ? holding.avgPrice : salePrice;
    const proceeds = remaining * salePrice;
    const costBase = remaining * costPerShare;
    const grossGain = proceeds - costBase - (feePerShare * remaining);
    disposals.push({
      saleDate,
      ticker: ticker.toUpperCase(),
      salePrice,
      saleQty: remaining,
      parcelId: null,
      parcelDate: null,
      parcelCostPerShare: costPerShare,
      heldDays: null,
      eligible50: false,
      proceeds,
      costBase,
      saleFee: feePerShare * remaining,
      grossGain,
      discount: 0,
      netGain: grossGain,
      note: 'No parcel — used avg cost basis',
    });
  }

  return disposals;
}

function applyBuyToPortfolio(ticker, qty, price, date, fees, sector) {
  const symbol = ticker.toUpperCase();
  const existing = getPortfolioHolding(symbol);
  if(existing) {
    const totalCostVal = existing.shares * existing.avgPrice + qty * price;
    existing.shares += qty;
    existing.avgPrice = totalCostVal / existing.shares;
    if(!existing.currentPrice) existing.currentPrice = price;
  } else {
    state.portfolio.push({ ticker: symbol, shares: qty, avgPrice: price, currentPrice: price, sector: sector || 'Other' });
  }
  // Always record a parcel
  addParcel(symbol, date || todayStr(), qty, price, fees || 0, sector);
}

function applySellToPortfolio(ticker, qty, sellPrice, fees, date, method) {
  const symbol = ticker.toUpperCase();
  const holding = getPortfolioHolding(symbol);
  if(!holding || holding.shares < qty) return { ok: false, disposals: [] };
  holding.currentPrice = sellPrice;
  holding.shares -= qty;
  if(holding.shares <= 0) {
    state.portfolio = state.portfolio.filter(h => h.ticker !== symbol);
  }
  state.cash += qty * sellPrice - Number(fees || 0);

  // Match against parcels and record disposals
  const disposals = matchSaleAgainstParcels(symbol, qty, sellPrice, date || todayStr(), fees || 0, method);
  state.cgtDisposals.push(...disposals);
  return { ok: true, disposals };
  
}

function computeSellPnl(costBasis, sellPrice, qty, fees = 0) {
  return (sellPrice - costBasis) * qty - Number(fees || 0);
}

// Compute total pnl from disposals for a sell trade
function disposalsToPnl(disposals) {
  return disposals.reduce((s,d) => s + d.grossGain, 0);
}

function rollbackTradeJournalEntry(t) {
  if(!t || !t.action || !t.ticker || !t.qty) return;
  // Treat TOP_UP like BUY and TRIM like SELL for rollback purposes.
  let action = t.action.toUpperCase();
  if(action === 'TOP_UP') action = 'BUY';
  if(action === 'TRIM')   action = 'SELL';
  if(action === 'BUY' && t.status === 'open') {
    const holding = getPortfolioHolding(t.ticker);
    if(!holding || holding.shares < t.qty) return;
    // Back-calculate avgPrice before this buy/top-up was applied.
    // totalCost_before = totalCost_after - (qty × entryPrice)
    const totalCostAfter  = holding.shares * holding.avgPrice;
    const topupCost       = t.qty * t.entryPrice;
    const sharesAfter     = holding.shares - t.qty;
    holding.shares        = sharesAfter;
    if (sharesAfter > 0) {
      holding.avgPrice = (totalCostAfter - topupCost) / sharesAfter;
    }
    state.cash += t.qty * t.entryPrice + Number(t.fees || 0);
    if(holding.shares <= 0) state.portfolio = state.portfolio.filter(h => h.ticker !== holding.ticker);
    // Remove matching parcel (last added for this ticker matching qty+price)
    if(t.parcelId) {
      state.cgtParcels = state.cgtParcels.filter(p => p.id !== t.parcelId);
    } else {
      const idx = [...state.cgtParcels].reverse().findIndex(p => p.ticker === t.ticker && p.qty === t.qty && Math.abs(p.costPerShare - t.entryPrice) < 0.001);
      if(idx !== -1) state.cgtParcels.splice(state.cgtParcels.length - 1 - idx, 1);
    }
    return;
  }
  if(action === 'SELL' && t.status === 'closed' && t.exitPrice != null) {
    const costBasis = t.entryPrice;
    const holding = getPortfolioHolding(t.ticker);
    if(holding) {
      const totalCostVal = holding.shares * holding.avgPrice + t.qty * costBasis;
      holding.shares += t.qty;
      holding.avgPrice = totalCostVal / holding.shares;
      holding.currentPrice = t.exitPrice;
    } else {
      state.portfolio.push({ ticker: t.ticker.toUpperCase(), shares: t.qty, avgPrice: costBasis, currentPrice: t.exitPrice, sector: 'Other' });
    }
    state.cash -= t.qty * t.exitPrice - Number(t.fees || 0);
    // Restore parcel remainingQty from disposals that belong to this trade
    if(t.disposalIds && t.disposalIds.length) {
      // Remove those disposals and restore parcel qty
      t.disposalIds.forEach(dIdx => {
        const d = state.cgtDisposals[dIdx];
        if(!d) return;
        if(d.parcelId) {
          const parcel = state.cgtParcels.find(p => p.id === d.parcelId);
          if(parcel) parcel.remainingQty += d.saleQty;
        }
      });
      // Remove disposal records (in reverse order to preserve indices)
      t.disposalIds.slice().sort((a,b)=>b-a).forEach(i => state.cgtDisposals.splice(i,1));
    }
    return;
  }
}
function toast(msg, type='info') {
  const c=document.getElementById('toast-container');
  const el=document.createElement('div');
  el.className='toast';
  el.style.borderLeft=`3px solid ${type==='success'?'#22c55e':type==='error'?'#ef4444':'#3b82f6'}`;
  el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>el.remove(), 3500);

let _schedulerInterval = null;
let _priceRefreshInterval = null; // Auto price refresh every 10 minutes
let _schedulerLog = []; // {time, type, msg}

function schedulerLog(type, msg) {
  const entry = {time: nowSydney(), date: todayStr(), type, msg};
  _schedulerLog.unshift(entry);
  // No in-memory limit - database handles 5-day retention
  // Update live log if settings page is open
  const logEl = document.getElementById('sched-log');
  if(logEl) renderSchedulerLog();
}

function renderSchedulerLog() {
  const logEl = document.getElementById('sched-log');
  if(!logEl) return;
  // _schedulerLog is newest-first (unshift). Show the most recent 20.
  const recent = _schedulerLog.slice(0, 20);
  if (recent.length === 0) {
    logEl.innerHTML = '<div class="text-xs text-muted" style="padding:8px">No activity yet.</div>';
    return;
  }
  const rows = recent.map(e=>`
    <div style="display:flex;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border-light);font-size:12px">
      <span style="color:var(--text-tertiary);white-space:nowrap">${e.date} ${e.time}</span>
      <span style="color:${e.type==='run'?'#16a34a':e.type==='skip'?'#d97706':'#6b6b6b'}">${e.type==='run'?'▶':e.type==='skip'?'—':'ℹ'}</span>
      <span style="color:var(--text-secondary)">${e.msg}</span>
    </div>`).join('');
  const footer = _schedulerLog.length > 20
    ? `<div class="text-xs text-muted" style="padding:6px 0 2px">Showing latest 20 of ${_schedulerLog.length} entries.</div>`
    : '';
  logEl.innerHTML = rows + footer;
}

function isWeekday() {
  // Sydney time weekday check
  const day = new Date().toLocaleDateString('en-AU',{timeZone:'Australia/Sydney',weekday:'long'});
  return !['Saturday','Sunday'].includes(day);
}

function sydneyHHMM() {
  // Returns current Sydney time as "HH:MM" string
  return new Date().toLocaleTimeString('en-AU',{timeZone:'Australia/Sydney',hour:'2-digit',minute:'2-digit',hour12:false});
}

function timeToMins(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + m;
}

function isInWindow() {
  const s = state.settings;
  const now = timeToMins(sydneyHHMM());
  const start = timeToMins(s.scheduleWindowStart || '10:00');
  const end   = timeToMins(s.scheduleWindowEnd   || '15:45');
  return now >= start && now <= end;
}

async function schedulerTick() {
  const s = state.settings;
  if(!s.scheduleEnabled) return;
  if(!getApiKey()) return;
  if(s.scheduleWeekdaysOnly && !isWeekday()) return;
  if(!isInWindow()) return;
  if(state.analysisRunning) { schedulerLog('skip','Skipped — analysis already running'); return; }

  const nowMins = timeToMins(sydneyHHMM());
  const startMins = timeToMins(s.scheduleWindowStart || '10:00');
  const endMins   = timeToMins(s.scheduleWindowEnd   || '15:45');
  const intervalMins = s.scheduleIntervalMins || 60;

  // Build the set of scheduled run times within the window.
  // Always include the exact end time as the final run.
  const slots = [];
  for (let t = startMins; t < endMins; t += intervalMins) slots.push(t);
  slots.push(endMins); // guaranteed end-of-day run at e.g. 15:45

  // Fire if the current minute matches any slot (within a 1-minute tolerance)
  const shouldRun = slots.some(slot => nowMins === slot);
  if (!shouldRun) return;

  // Deduplicate: skip if we already ran within this same minute
  const runKey = `asx_ran_${todayStr()}_${sydneyHHMM()}`;
  if (sessionStorage.getItem(runKey)) return;
  sessionStorage.setItem(runKey, '1');

  schedulerLog('run', `Scheduled run at ${sydneyHHMM()} (every ${intervalMins}m, window ${s.scheduleWindowStart}–${s.scheduleWindowEnd})`);
  state.settings._lastScheduledRunAt = sydneyHHMM(); // track for dashboard display
  scheduleSave();
  toast('⏱ Scheduled analysis running...', 'info');
  await runAnalysis();
}

function applyScheduler() {
  clearInterval(_schedulerInterval);
  _schedulerInterval = null;
  const s = state.settings;
  if(!s.scheduleEnabled) {
    schedulerLog('info','Scheduler disabled');
    updateSchedulerStatus();
    return;
  }

  // 1-minute heartbeat — checks clock each minute, fires when time matches a slot
  _schedulerInterval = setInterval(schedulerTick, 60 * 1000);
  // Keep the status display (next run time) fresh every minute
  if (!window._schedStatusInterval) {
    window._schedStatusInterval = setInterval(updateSchedulerStatus, 60 * 1000);
  }
  schedulerLog('info', `Scheduler started — every ${s.scheduleIntervalMins}m, ${s.scheduleWindowStart}–${s.scheduleWindowEnd} Sydney (last run guaranteed at ${s.scheduleWindowEnd})`);
  updateSchedulerStatus();

  // Run immediately on open if in window — once per session per day
  const sessionKey = 'asx_scheduler_ran_' + todayStr();
  const alreadyRanThisSession = sessionStorage.getItem(sessionKey);
  if(s.scheduleRunOnOpen && isInWindow() && (s.scheduleWeekdaysOnly ? isWeekday() : true) && !alreadyRanThisSession) {
    sessionStorage.setItem(sessionKey, '1');
    setTimeout(()=>{ schedulerLog('run','Run-on-open triggered'); runAnalysis(); }, 2000);
  }
}

function updateSchedulerStatus() {
  const el = document.getElementById('sched-status');
  if(!el) return;
  const s = state.settings;
  if(!s.scheduleEnabled) {
    el.innerHTML = '<span style="color:var(--text-tertiary)">○ Scheduler off</span>';
    return;
  }
  const inWin  = isInWindow();
  const wkday  = !s.scheduleWeekdaysOnly || isWeekday();
  const active = inWin && wkday;

  // Compute all scheduled slots and find the next one
  const startMins   = timeToMins(s.scheduleWindowStart || '10:00');
  const endMins     = timeToMins(s.scheduleWindowEnd   || '15:45');
  const intervalMins = s.scheduleIntervalMins || 60;
  const slots = [];
  for (let t = startMins; t < endMins; t += intervalMins) slots.push(t);
  slots.push(endMins);
  const slotLabels = slots.map(m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);

  const nowMins = timeToMins(sydneyHHMM());
  const nextSlot = slots.find(t => t > nowMins);
  const nextLabel = nextSlot != null
    ? `${String(Math.floor(nextSlot/60)).padStart(2,'0')}:${String(nextSlot%60).padStart(2,'0')}`
    : 'none today';

  el.innerHTML = `
    <span style="color:${active?'#16a34a':'#d97706'}">${active?'● Active':'◌ Waiting'}</span>
    <span style="color:var(--text-tertiary);font-size:11px">
      · every ${intervalMins}m · ${s.scheduleWindowStart}–${s.scheduleWindowEnd}
      ${active ? `· <strong>next run: ${nextLabel}</strong>` : ''}
    </span>
    <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px">
      Scheduled slots: ${slotLabels.join(', ')}
    </div>`;
}

async function loadStateFromDb() {
  try {
    const r = await fetch(`${API}/api/db/load`);
    if (!r.ok) return false;
    const data = await r.json();
    if (!data.hasData) return false;

    if (data.portfolio !== undefined)    state.portfolio    = data.portfolio;
    if (data.tradeJournal !== undefined) state.tradeJournal = data.tradeJournal;
    if (data.recHistory !== undefined)   state.recHistory   = data.recHistory;
    if (data.cash != null)               state.cash         = data.cash;
    if (data.settings && Object.keys(data.settings).length) {
      state.settings = {...state.settings, ...data.settings};
    }
    if (data.activityLog != null) {
      _schedulerLog = data.activityLog;
    }
    if (data.portfolioHistory != null) {
      state.portfolioHistory = data.portfolioHistory;
    }
    if (data.cgtParcels != null)   state.cgtParcels   = data.cgtParcels;
    if (data.cgtDisposals != null) state.cgtDisposals = data.cgtDisposals;
    if (data.cgtMethod != null)    state.cgtMethod    = data.cgtMethod;
    if (data.analysisConfig != null) state.analysisConfig = { ...state.analysisConfig, ...data.analysisConfig };
    if (data.macroData != null)         state.macroData         = data.macroData;
    if (data.macroDate != null)         state.macroDate         = data.macroDate;
    if (data.analysisLastSummary != null) state.analysisLastSummary = data.analysisLastSummary;
    return true;
  } catch(e) {
    return false;
  }
}

// ============================================================
// RECONCILE JOURNAL → PARCELS
// Runs on load and can be triggered manually.
// Creates missing parcels for BUY entries that have no parcelId,
// and links the journal entry back to the parcel.
// ============================================================
function reconcileJournalParcels() {
  let created = 0;
  // Walk journal oldest-first so parcels are created in chronological order
  const buys = state.tradeJournal
    .filter(t => t.action === 'BUY' && !t.parcelId)
    .sort((a, b) => (a.date||'').localeCompare(b.date||''));

  for (const t of buys) {
    // Check if a parcel already exists that matches this trade closely
    const existing = state.cgtParcels.find(p =>
      p.ticker === t.ticker &&
      p.date === t.date &&
      p.qty === t.qty &&
      Math.abs(p.costPerShare - t.entryPrice) < 0.005
    );
    if (existing) {
      t.parcelId = existing.id;
    } else {
      // Create the missing parcel
      addParcel(t.ticker, t.date || todayStr(), t.qty, t.entryPrice, t.fees || 0, t.sector || 'Other');
      const newParcel = state.cgtParcels[state.cgtParcels.length - 1];
      t.parcelId = newParcel.id;
      created++;
    }
  }
  return created;
}

async function refreshPrices(opts = {}) {
  const {silent = false} = opts;
  if(!state.serverOk) { if(!silent) toast('Backend server not running. See Settings.','error'); return 0; }
  if(!silent) toast('Fetching live ASX prices...','info');
  const uniqueTickers = [...new Set(state.portfolio.map(h => h.ticker))];
  let updated = 0;
  for(const ticker of uniqueTickers) {
    try {
      const r = await fetch(`${API}/api/quote/${ticker}`);
      if(!r.ok) continue;
      const d = await r.json();
      if(d.price) {
        state.portfolio.filter(h => h.ticker === ticker).forEach(h => {
          h.currentPrice = d.price;
          if(d.sector && (!h.sector || h.sector === 'Other')) h.sector = d.sector;
        });
        updated++;
      }
    } catch {}
  }
  state.lastPriceRefresh = Date.now();
  if(!silent) toast(`Updated ${updated} prices from yfinance`,'success');
  recordPortfolioSnapshot();
  scheduleSave();
  renderPage();
  return updated;
}

// PORTFOLIO SNAPSHOT (records net worth over time)
// ============================================================
function recordPortfolioSnapshot() {
  const today = todayStr();
  const nw = totalNetWorth();
  const pv = portfolioValue();
  const last = state.portfolioHistory[state.portfolioHistory.length - 1];
  // Only record one snapshot per day (overwrite if same day)
  if (last && last.date === today) {
    last.netWorth = nw;
    last.portfolioValue = pv;
    last.cash = state.cash;
  } else {
    state.portfolioHistory.push({ date: today, netWorth: nw, portfolioValue: pv, cash: state.cash });
  }
  // Keep max 3 years of daily data
  if (state.portfolioHistory.length > 1095) state.portfolioHistory.shift();
  // Always persist to localStorage as fallback (works even when backend is offline)
  try { localStorage.setItem('asx_portfolio_history', JSON.stringify(state.portfolioHistory)); } catch {}
}

let _historyPeriod = 'monthly';

function renderPortfolioHistory() {
  const history = state.portfolioHistory;
  const now = totalNetWorth();
  const pv  = portfolioValue();

  // Compute period-bucketed data
  function getFilteredData(period) {
    if (!history.length) return [];
    const today = new Date();
    let cutoff;
    if (period === 'daily')   { cutoff = new Date(today); cutoff.setDate(today.getDate() - 30); }
    if (period === 'weekly')  { cutoff = new Date(today); cutoff.setDate(today.getDate() - 90); }
    if (period === 'monthly') { cutoff = new Date(today); cutoff.setFullYear(today.getFullYear() - 2); }
    if (period === 'yearly')  { cutoff = new Date(today); cutoff.setFullYear(today.getFullYear() - 10); }
    if (!cutoff) { cutoff = new Date(today); cutoff.setFullYear(today.getFullYear() - 10); }

    const filtered = history.filter(s => parseDate(s.date) >= cutoff);

    if (period === 'daily') return filtered;

    // Group
    const grouped = {};
    filtered.forEach(s => {
      let key;
      const d = parseDate(s.date);
      if (period === 'weekly') {
        const startOfWeek = new Date(d); startOfWeek.setDate(d.getDate() - d.getDay());
        key = startOfWeek.toISOString().slice(0,10);
      } else if (period === 'monthly') {
        key = `${s.date.slice(6,10)}-${s.date.slice(3,5)}-01`;
      } else { // yearly
        key = `${s.date.slice(6,10)}-01-01`;
      }
      grouped[key] = s; // last entry in period wins
    });
    return Object.keys(grouped).sort().map(k => grouped[k]);
  }

  const data = getFilteredData(_historyPeriod);

  // Stats
  const first = data[0];
  const change = first ? now - first.netWorth : 0;
  const changePct = first && first.netWorth ? (change / first.netWorth) * 100 : 0;
  const maxNW = data.length ? Math.max(...data.map(d=>d.netWorth)) : now;
  const minNW = data.length ? Math.min(...data.map(d=>d.netWorth)) : now;

  const periodLabels = {daily:'Last 30 days',weekly:'Last 90 days',monthly:'Last 2 years',yearly:'All time'};

  // Summary row for individual holdings
  const holdingRows = state.portfolio.map(h => {
    const val = h.shares * h.currentPrice;
    const cost = h.shares * h.avgPrice;
    const pl = val - cost;
    const plp = cost ? (pl/cost)*100 : 0;
    return { ticker: h.ticker, sector: h.sector, val, pl, plp };

  return `
    <div class="metrics-grid" style="margin-bottom:1.25rem">
      <div class="metric-card">
        <div class="metric-label">Net Worth (now)</div>
        <div class="metric-value">$${fmt(now)}</div>
        <div class="metric-sub">Stocks + Cash</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Portfolio Value</div>
        <div class="metric-value">$${fmt(pv)}</div>
        <div class="metric-sub">Equities only</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Cash</div>
        <div class="metric-value">$${fmt(state.cash)}</div>
        <div class="metric-sub">${fmt(state.cash/now*100)}% of net worth</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Period Change</div>
        <div class="metric-value ${change>=0?'up':'down'}">${change>=0?'+':''}$${fmt(Math.abs(change))}</div>
        <div class="metric-sub ${change>=0?'up':'down'}">${change>=0?'+':''}${fmt(Math.abs(changePct))}% · ${periodLabels[_historyPeriod]}</div>
      </div>
    </div>

    <div class="card section-gap">
      <div class="flex-between" style="margin-bottom:1rem">
        <div class="card-title" style="margin:0">Portfolio Value Over Time</div>
        <div class="flex-row" style="gap:6px">
          ${['daily','weekly','monthly','yearly'].map(p=>`
            <button class="btn btn-sm ${_historyPeriod===p?'btn-primary':''}" onclick="_historyPeriod='${p}';document.getElementById('main-content').innerHTML=renderPortfolioHistory();setTimeout(drawHistoryChart,80)">${p.charAt(0).toUpperCase()+p.slice(1)}</button>
          `).join('')}
          <button class="btn btn-sm" onclick="recordPortfolioSnapshot();scheduleSave();document.getElementById('main-content').innerHTML=renderPortfolioHistory();setTimeout(drawHistoryChart,80)" title="Record today's snapshot now">⊕ Snapshot</button>
        </div>

      ${data.length < 2 ? `
        <div class="empty-state" style="padding:2rem">
          <div class="empty-icon">▥</div>
          <p>Not enough data yet for this period.</p>
          <p class="sub">Snapshots are auto-recorded when you refresh prices. Click <strong>⊕ Snapshot</strong> above to record today's value now.</p>

function drawHistoryChart() {
  const canvas = document.getElementById('history-chart');
  if (!canvas) return;

  function getFilteredData(period) {
    const history = state.portfolioHistory;
    if (!history.length) return [];
    const today = new Date();
    let cutoff = new Date(today);
    if (period === 'daily')   cutoff.setDate(today.getDate() - 30);
    if (period === 'weekly')  cutoff.setDate(today.getDate() - 90);
    if (period === 'monthly') cutoff.setFullYear(today.getFullYear() - 2);
    if (period === 'yearly')  cutoff.setFullYear(today.getFullYear() - 10);
    const filtered = history.filter(s => parseDate(s.date) >= cutoff);
    if (period === 'daily') return filtered;
    const grouped = {};
    filtered.forEach(s => {
      let key;
      const d = parseDate(s.date);
      if (period === 'weekly') {
        const sow = new Date(d); sow.setDate(d.getDate() - d.getDay());
        key = sow.toISOString().slice(0,10);
      } else if (period === 'monthly') {
        key = `${s.date.slice(6,10)}-${s.date.slice(3,5)}-01`;
      } else {
        key = `${s.date.slice(6,10)}-01-01`;

      }
      grouped[key] = s;
    });
    return Object.keys(grouped).sort().map(k => grouped[k]);
  }

  const data = getFilteredData(_historyPeriod);
  if (data.length < 2) return;

  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || 600;
  const h = 240;
  canvas.width = w; canvas.height = h;

  const nwArr = data.map(d => d.netWorth);
  const pvArr = data.map(d => d.portfolioValue);
  const cashArr = data.map(d => d.cash);
  const allVals = [...nwArr, ...pvArr, ...cashArr];
  const minV = Math.min(...allVals) * 0.98;
  const maxV = Math.max(...allVals) * 1.02;
  const range = maxV - minV || 1;

  const pad = { t: 16, r: 16, b: 40, l: 72 };
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;

  const px = v => pad.t + ch - ((v - minV) / range) * ch;
  const py = i => pad.l + (i / (data.length - 1)) * cw;

  // Dark mode detection
  const isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const gridCol = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
  const textCol = isDark ? '#888' : '#999';

  ctx.clearRect(0, 0, w, h);

  // Grid lines + y-axis labels
  ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const yv = minV + range * (1 - f);
    const y = px(yv);
    ctx.strokeStyle = gridCol; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = textCol;
    ctx.fillText('$' + (yv >= 1000 ? (yv/1000).toFixed(0)+'k' : yv.toFixed(0)), pad.l - 6, y + 3);
  });

  // X-axis labels
  ctx.textAlign = 'center'; ctx.fillStyle = textCol;
  const step = Math.max(1, Math.floor(data.length / 6));
  data.forEach((d, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    const lbl = _historyPeriod === 'yearly' ? d.date.slice(6,10) :
                _historyPeriod === 'monthly' ? d.date.slice(3,10) :
                d.date.slice(0,5);
    ctx.fillText(lbl, py(i), h - pad.b + 14);
  });

  // Draw a line series
  function drawLine(arr, color, dashed) {
    ctx.beginPath();
    arr.forEach((v, i) => i === 0 ? ctx.moveTo(py(i), px(v)) : ctx.lineTo(py(i), px(v)));
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    if (dashed) ctx.setLineDash([4, 3]); else ctx.setLineDash([]);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Gradient fill under net worth
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, 'rgba(59,130,246,0.18)');
  grad.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.beginPath();
  nwArr.forEach((v, i) => i === 0 ? ctx.moveTo(py(i), px(v)) : ctx.lineTo(py(i), px(v)));
  ctx.lineTo(py(data.length - 1), pad.t + ch);
  ctx.lineTo(py(0), pad.t + ch);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  drawLine(nwArr, '#3b82f6', false);
  drawLine(pvArr, '#22c55e', false);
  drawLine(cashArr, '#f59e0b', true);

  // Dots at last point
  [['#3b82f6', nwArr], ['#22c55e', pvArr], ['#f59e0b', cashArr]].forEach(([col, arr]) => {
    const lastX = py(arr.length - 1), lastY = px(arr[arr.length - 1]);
    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI*2);
    ctx.fillStyle = col; ctx.fill();
  });
}


async function fetchSignals(tickers, forceRefresh=false) {
  if(!state.serverOk) return {};
  const now = Date.now();
  const stale = tickers.filter(t => forceRefresh || !state.lastSignalFetch[t] || (now - state.lastSignalFetch[t]) > 15*60*1000);
  if(!stale.length) return state.liveSignals;

  try {
    const r = await fetch(`${API}/api/analyse/batch`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tickers: stale, period:'6mo'})
    });
    if(!r.ok) return state.liveSignals;
    const data = await r.json();
    stale.forEach(t => {
      state.liveSignals[t] = data[t];
      state.lastSignalFetch[t] = now;
    });
  } catch {}
  // Recompute critical alerts whenever fresh signal data arrives
  computeCriticalAlerts();
  return state.liveSignals;
}

function drawSparkline(canvasId, data, color='#3b82f6') {
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || canvas.width;
  const h = canvas.offsetHeight || canvas.height;
  canvas.width = w; canvas.height = h;
  if(!data || data.length<2) return;
  const prices = data.map(d=>d.close);
  const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, color+'44');
  grad.addColorStop(1, color+'00');
  ctx.beginPath();
  prices.forEach((p,i)=>{
    const x=(i/(prices.length-1))*w, y=h-((p-min)/range)*(h-8)-4;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grad;
  ctx.fill();
}

function drawPriceChart(canvasId, chartData, sma20, sma50, bbUpper, bbLower) {
  const canvas = document.getElementById(canvasId);
  if(!canvas || !chartData?.length) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth; const h = canvas.height = 180;
  canvas.width = w;
  const prices = chartData.map(d=>d.close);
  const allVals = [...prices];
  if(sma20) allVals.push(sma20);
  if(bbUpper) allVals.push(bbUpper);
  if(bbLower) allVals.push(bbLower);
  const min=Math.min(...allVals)-Math.min(...allVals)*0.01, max=Math.max(...allVals)+Math.max(...allVals)*0.01;
  const range=max-min||1;
  const px=(v) => h-((v-min)/range)*h;
  const py=(i) => (i/(chartData.length-1))*(w-8)+4;

  ctx.clearRect(0,0,w,h);

  // BB fill
  if(bbUpper && bbLower) {
    ctx.beginPath();
    chartData.forEach((_,i)=>{ const x=py(i); i===0?ctx.moveTo(x,px(bbUpper)):ctx.lineTo(x,px(bbUpper)); });
    chartData.slice().reverse().forEach((_,i)=>{ const ii=chartData.length-1-i; ctx.lineTo(py(ii),px(bbLower)); });
    ctx.closePath();
    ctx.fillStyle='rgba(59,130,246,0.07)';
    ctx.fill();
  }

  // Price line
  ctx.beginPath();
  chartData.forEach((d,i)=>{ const x=py(i),y=px(d.close); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1.5; ctx.stroke();

  // SMA20
  if(sma20) {
    ctx.beginPath(); ctx.moveTo(4,px(sma20));
    chartData.forEach((_,i)=>ctx.lineTo(py(i),px(sma20)));
    ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function showPage(page) {
  state.page = page;
  state._renderGen = (state._renderGen || 0) + 1; // invalidate any in-flight async renders
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => { if(el.getAttribute('onclick')?.includes("'"+page+"'")) el.classList.add('active'); });

  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage();
}
function renderPage() {
  const el = document.getElementById('main-content');
  const gen = (state._renderGen = (state._renderGen || 0)); // snapshot current gen
  switch(state.page) {
    case 'dashboard':       el.innerHTML = renderDashboard(); break;

function toggleLots(ticker) {
  const row = document.getElementById(`lots-${ticker}`);
  const arrow = document.getElementById(`lots-arrow-${ticker}`);
  if (!row) return;
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : 'table-row';
  if (arrow) arrow.textContent = open ? '▶' : '▼';
}

function handleCSV(e) {
  const file = e.target.files[0]; if (!file) return;
  // Reset input so same file can be re-imported if needed
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.trim().split('\n');
    const header = lines[0].toLowerCase().replace(/\s/g,'');

    // Detect column positions from header
    const cols = header.split(',');
    const ci = name => cols.findIndex(c => c.includes(name));
    const iDate    = ci('date');
    const iTicker  = ci('ticker') >= 0 ? ci('ticker') : ci('symbol') >= 0 ? ci('symbol') : ci('stock');
    const iShares  = ci('shares') >= 0 ? ci('shares') : ci('qty') >= 0 ? ci('qty') : ci('quantity');
    const iPrice   = ci('price') >= 0 ? ci('price') : ci('avg') >= 0 ? ci('avg') : ci('cost');
    const iSector  = ci('sector');
    const iFees    = ci('fee') >= 0 ? ci('fee') : ci('brokerage');

    if (iTicker < 0 || iShares < 0 || iPrice < 0) {
      toast('CSV must include columns: ticker, shares, avg_price (and date)', 'error');
      return;
    }

    // Validate all rows have a date before doing anything
    const dataLines = lines.slice(1).filter(l => l.trim());
    const missingDates = [];
    const parsedRows = [];

    for (let i = 0; i < dataLines.length; i++) {
      const parts = dataLines[i].split(',').map(s => s.trim().replace(/^"|"$/g,''));
      const ticker  = parts[iTicker]?.toUpperCase();
      const shares  = Number(parts[iShares]);
      const price   = Number(parts[iPrice]);
      const dateRaw = iDate >= 0 ? parts[iDate] : '';
      const sector  = iSector >= 0 ? (parts[iSector] || 'Other') : 'Other';
      const fees    = iFees >= 0 ? Number(parts[iFees] || 0) : 0;

      if (!ticker || !shares || !price) continue;

      // Validate date format
      const dateValid = dateRaw && /^\d{2}-\d{2}-\d{4}$/.test(dateRaw);
      if (!dateValid) missingDates.push(`Row ${i+2}: ${ticker} — "${dateRaw || 'blank'}"`);

      parsedRows.push({ ticker, shares, price, date: dateRaw, sector, fees, dateValid });
    }

    if (missingDates.length > 0) {
      const msg = `Import blocked — ${missingDates.length} row(s) missing a valid date (DD-MM-YYYY):\n\n${missingDates.slice(0,8).join('\n')}${missingDates.length>8?`\n...and ${missingDates.length-8} more`:''}`;
      alert(msg);
      toast(`Import failed — add dates to all rows`, 'error');
      return;
    }

    // Sort chronologically so FIFO parcel order is correct
    parsedRows.sort((a, b) => a.date.localeCompare(b.date));

    let added = 0, updated = 0, parcelsCreated = 0;

    for (const row of parsedRows) {
      const { ticker, shares, price, date, sector, fees } = row;

      // Check for exact duplicate parcel (same ticker + date + qty + price) — skip
      const dupParcel = state.cgtParcels.find(p =>
        p.ticker === ticker && p.date === date &&
        p.qty === shares && Math.abs(p.costPerShare - price) < 0.005
      );
      if (dupParcel) continue;

      // Update portfolio holding (weighted avg across all lots)
      const existing = state.portfolio.find(h => h.ticker === ticker);
      if (existing) {
        const totalCostVal = existing.shares * existing.avgPrice + shares * price;
        existing.shares += shares;
        existing.avgPrice = totalCostVal / existing.shares;
        if (sector !== 'Other') existing.sector = sector;
        updated++;
      } else {
        state.portfolio.push({ ticker, shares, avgPrice: price, currentPrice: price, sector });
        added++;
      }

      // Create CGT parcel
      addParcel(ticker, date, shares, price, fees, sector);
      const newParcel = state.cgtParcels[state.cgtParcels.length - 1];
      parcelsCreated++;

      // Create a BUY journal entry for this lot
      state.tradeJournal.push({
        id: state.tradeJournal.length + 1,
        date,
        ticker,
        action: 'BUY',
        qty: shares,
        entryPrice: price,
        exitPrice: null,
        fees,
        status: 'open',
        pnl: null,
        parcelId: newParcel.id,
        recId: null,
        recExecuted: false,
        timestamp: `${date} (imported)`,
        imported: true,
      });
    }

    // Re-sort journal chronologically after import
    state.tradeJournal.sort((a, b) => (a.date||'').localeCompare(b.date||''));

    toast(`Imported ${added + updated} holdings · ${parcelsCreated} CGT parcels created — click Refresh Prices for live data`, 'success');
    scheduleSave();
    renderPage();
  };
  reader.readAsText(file);
}
function addHolding() {
  const ticker = prompt('Ticker (e.g. NAB):'); if (!ticker) return;
  const dateRaw = prompt('Buy date (DD-MM-YYYY):');
  if (!dateRaw || !/^\d{2}-\d{2}-\d{4}$/.test(dateRaw)) { toast('Invalid date — use DD-MM-YYYY format', 'error'); return; }
  const shares = Number(prompt('Shares:')); if (!shares) return;
  const avg = Number(prompt('Avg buy price ($):')); if (!avg) return;
  const sector = prompt('Sector (e.g. Banking):') || 'Other';
  const fees = Number(prompt('Brokerage paid ($, e.g. 10):') || state.settings.brokerage);
  const symbol = ticker.toUpperCase();

  // Update portfolio
  const existing = state.portfolio.find(h => h.ticker === symbol);
  if (existing) {
    const totalCostVal = existing.shares * existing.avgPrice + shares * avg;
    existing.shares += shares;
    existing.avgPrice = totalCostVal / existing.shares;
    if (sector !== 'Other') existing.sector = sector;
  } else {
    state.portfolio.push({ ticker: symbol, shares, avgPrice: avg, currentPrice: avg, sector });
  }

  // Create CGT parcel
  addParcel(symbol, dateRaw, shares, avg, fees, sector);
  const newParcel = state.cgtParcels[state.cgtParcels.length - 1];

  // Create journal entry
  state.tradeJournal.unshift({
    id: state.tradeJournal.length + 1,
    date: dateRaw,
    ticker: symbol,
    action: 'BUY',
    qty: shares,
    entryPrice: avg,
    exitPrice: null,
    fees,
    status: 'open',
    pnl: null,
    parcelId: newParcel.id,
    recId: null,
    recExecuted: false,
    timestamp: `${dateRaw} (manual)`,
  });

  toast(`Added ${symbol} — click Refresh Prices to get live price`, 'success');
  scheduleSave();
  renderPage();
}
function removeHolding(i) {
  if(!confirm(`Remove ${state.portfolio[i].ticker}?`)) return;
  state.portfolio.splice(i,1); scheduleSave(); renderPage();
}

async function fetchRealMacro() {
  if(!state.serverOk) { toast('Backend server not running','error'); return; }
  toast('Fetching live macro data...','info');
  try {
    const r = await fetch(`${API}/api/macro`);
    if(!r.ok) throw new Error('Server error');
    const data = await r.json();
    state.macroData = {...data, _source:'live'};
    toast('Live macro data loaded','success'); renderPage();
  } catch(e) {
    toast('Macro fetch error: '+e.message,'error');
  }
}

async function runMacroAnalysis(force=false) {
  const key=getApiKey();
  if(!key){toast('Add API key in Settings','error');showPage('settings');return;}

  // Once-per-day guard — skip if already ran today (unless forced)
  const today = todayStr();
  if(!force && state.macroDate === today && state.macroData?.analysis) {
    toast('Macro brief already ran today — showing cached data','info');
    renderPage();
    return;
  }

  // First fetch live data if available
  let liveCtx='';
  if(state.serverOk) {
    try {
      const r=await fetch(`${API}/api/macro`);
      if(r.ok) {
        const d=await r.json();
        state.macroData={...d, _source:'live'};
        const lines=[];
        if(d.sp500) lines.push(`S&P500: ${fmt(d.sp500.value)} (${fmtp(d.sp500.change_pct)})`);
        if(d.asx200) lines.push(`ASX200: ${fmt(d.asx200.value)} (${fmtp(d.asx200.change_pct)})`);
        if(d.gold) lines.push(`Gold: ${fmt(d.gold.value)} (${fmtp(d.gold.change_pct)})`);
        if(d.aud_usd) lines.push(`AUD/USD: ${fmt(d.aud_usd.value,4)} (${fmtp(d.aud_usd.change_pct)})`);
        if(d.vix) lines.push(`VIX: ${fmt(d.vix.value)}`);
        liveCtx = lines.join(' | ');
      }
    } catch {}
  }

  const system=`You are a macro analyst for Australian equity markets. Return ONLY valid JSON, no markdown.
Format: {"sentiment":"risk-on"|"risk-off","sentimentConf":0-1,"bullish":0-100,"analysis":"3 paragraph analysis","keyDrivers":"key market drivers today"}`;
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system,messages:[{role:'user',content:`Provide current macro analysis for ASX morning brief. Today: ${todayStr()}${liveCtx?'. Live market data: '+liveCtx:'. Use realistic current estimates.'}  Return only JSON.`}]})});
    const data=await r.json();
    if(data.error) throw new Error(data.error.message);
    const text=data.content?.[0]?.text||'{}';
    const ai=JSON.parse(text.replace(/```json|```/g,'').trim());
    state.macroData={...state.macroData, ...ai, _source:'ai'};
    state.macroDate = today;
    scheduleSave();
    toast('AI macro brief ready','success'); renderPage();
  } catch(e) {
    toast('Macro error: '+e.message,'error');
  }
}

          </div>

      </div>`;
    }).join('')}
  `;

  el.innerHTML=html;

  // Draw sparkline charts for each ticker with data — guard gen again in case of slow draws
  tickers.forEach(t=>{
    const s=signals[t];
    if(s&&!s.error&&s.chart_data?.length) {
      setTimeout(()=>{ if(state._renderGen===gen) drawSparklineFromData(t, s); }, 50);
    }
  });
}

function drawSparklineFromData(ticker, s) {
  const canvas=document.getElementById(`chart-${ticker}`);
  if(!canvas||!s.chart_data?.length) return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||800;
  canvas.height=180;
  const w=canvas.width, h=canvas.height;
  const data=s.chart_data;
  const prices=data.map(d=>d.close);
  const allV=[...prices];
  if(s.bb_upper) allV.push(s.bb_upper);
  if(s.bb_lower) allV.push(s.bb_lower);
  const mn=Math.min(...allV)*0.998, mx=Math.max(...allV)*1.002, rng=mx-mn||1;
  const px=v=>h-((v-mn)/rng)*(h-20)-10;
  const py=i=>(i/(data.length-1))*(w-20)+10;

  ctx.clearRect(0,0,w,h);

  // Grid lines
  ctx.strokeStyle='rgba(128,128,128,0.1)'; ctx.lineWidth=0.5;
  [0.25,0.5,0.75].forEach(f=>{ ctx.beginPath(); ctx.moveTo(0,h*f); ctx.lineTo(w,h*f); ctx.stroke(); });

  // BB bands
  if(s.bb_upper&&s.bb_lower) {
    ctx.beginPath();
    data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.bb_upper)):ctx.lineTo(py(i),px(s.bb_upper)));
    data.slice().reverse().forEach((_,i)=>ctx.lineTo(py(data.length-1-i),px(s.bb_lower)));
    ctx.closePath(); ctx.fillStyle='rgba(59,130,246,0.06)'; ctx.fill();
    // BB lines
    ctx.setLineDash([2,3]); ctx.strokeStyle='rgba(59,130,246,0.4)'; ctx.lineWidth=1;
    ['bb_upper','bb_lower'].forEach(k=>{ ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s[k])):ctx.lineTo(py(i),px(s[k]))); ctx.stroke(); });
    ctx.setLineDash([]);
  }

  // SMA lines
  if(s.sma_20) { ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.sma_20)):ctx.lineTo(py(i),px(s.sma_20))); ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]); }
  if(s.sma_50) { ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.sma_50)):ctx.lineTo(py(i),px(s.sma_50))); ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]); }

  // Price line with gradient fill
  const grad=ctx.createLinearGradient(0,0,0,h);
  const isUp=prices[prices.length-1]>=prices[0];
  grad.addColorStop(0, isUp?'rgba(22,163,74,0.15)':'rgba(220,38,38,0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  data.forEach((d,i)=>i===0?ctx.moveTo(py(i),px(d.close)):ctx.lineTo(py(i),px(d.close)));
  ctx.strokeStyle=isUp?'#16a34a':'#dc2626'; ctx.lineWidth=2; ctx.stroke();
  ctx.lineTo(w-10,h); ctx.lineTo(10,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

  // Current price label
  const cp=prices[prices.length-1];
  ctx.fillStyle=isUp?'#16a34a':'#dc2626';
  ctx.font='11px sans-serif';
  ctx.textAlign='right';
  ctx.fillText(`$${cp.toFixed(3)}`, w-12, px(cp)-4);

  // Legend
  ctx.font='10px sans-serif'; ctx.textAlign='left';
  const leg=[['─ Price',isUp?'#16a34a':'#dc2626'],['-- SMA20','#f59e0b'],['-- SMA50','#8b5cf6'],['~~ BB','#3b82f6']];
  leg.forEach(([l,c],i)=>{ ctx.fillStyle=c; ctx.fillText(l,10+i*85,14); });
}

function addExtraTicker(ticker) {
  const t = ticker.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!t) return;
  const portfolioTickers = mergedPortfolio().map(h=>h.ticker);
  if(portfolioTickers.includes(t)) { toast(`${t} is already in your portfolio`, 'info'); return; }
  if(!state.analysisConfig.extraTickers) state.analysisConfig.extraTickers=[];
  if(state.analysisConfig.extraTickers.includes(t)) { toast(`${t} already added`, 'info'); return; }
  state.analysisConfig.extraTickers.push(t);
  scheduleSave();
  // Re-render just the run panel
  const el = document.getElementById('rec-content');
  if(el) el.innerHTML = renderRunAnalysisPanel();
  // Make sure the Run Analysis tab stays active
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('tab-run');
  if(tab) tab.classList.add('active');
}

function addExtraTickerFromInput() {
  const input = document.getElementById('extra-ticker-input');
  if(!input) return;
  const raw = input.value.trim().toUpperCase().replace(/[^A-Z0-9,\s]/g,'');
  const tickers = raw.split(/[,\s]+/).filter(Boolean);
  tickers.forEach(t => addExtraTicker(t));
  input.value = '';
}

function renderPendingRecs(recs) {
  const summary = state.analysisLastSummary;
  if(!recs.length) {
    const hasRunBefore = summary && summary.text;
    return `<div class="card"><div class="empty-state" style="text-align:left;padding:1.5rem">
      <div style="text-align:center;margin-bottom:1rem"><div class="empty-icon">◆</div></div>
      ${hasRunBefore ? `
        <div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:1rem;border-left:3px solid var(--border-medium)">
          <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            Analyst Summary · ${summary.time} ${summary.date}
          </div>
          <p style="font-size:13px;line-height:1.75;color:var(--text-primary);white-space:pre-wrap">${summary.text}</p>
        </div>
        <p class="sub" style="text-align:center">No actionable setups found — see reasoning above. Run again when conditions change.</p>
      ` : `
        <p style="color:var(--text-secondary);font-size:14px;text-align:center">No pending recommendations.</p>
        <p class="sub" style="text-align:center">Go to <strong>▶ Run Analysis</strong> tab to configure and run. The AI will use live yfinance indicator data when available.</p>
      `}
      <div style="text-align:center;margin-top:1rem">
        <button class="btn btn-primary" onclick="switchRecTab('run')">▶ Run Analysis</button>
      </div>
    </div></div>`;
  }

  const summaryBanner = (state.analysisLastSummary?.text && recs.length) ? `
    <div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:12px;border-left:3px solid #3b82f6">
      <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">
        Analyst Summary · ${state.analysisLastSummary.time} ${state.analysisLastSummary.date}
      </div>
      <p style="font-size:13px;line-height:1.7;color:var(--text-primary)">${state.analysisLastSummary.text}</p>
    </div>` : '';

  const tile = (label, body, sub) => `
    <div style="background:var(--bg-secondary);padding:8px 12px;border-radius:var(--radius-md)">
      <div class="text-xs">${label}</div>
      <div style="font-weight:600;font-size:13px">${body}</div>
      ${sub ? `<div class="text-xs text-muted" style="margin-top:2px">${sub}</div>` : ''}
    </div>`;

  return summaryBanner + recs.map(r => {
    const isReducing = r.action === 'SELL' || r.action === 'TRIM';
    const holding   = isReducing ? getPortfolioHolding(r.ticker) : null;
    const avgCost   = holding ? holding.avgPrice : null;
    const heldQty   = holding ? holding.shares : 0;
    const qty       = r.qty || 0;
    // Sell price = the lower bound of the AI's priceRange (treat as a limit). If the
    // AI returned a single number or only target, fall back gracefully.
    const sellPrice = r.priceRange?.[0] ?? r.target;

    // Recompute Net Realised P&L using the user's actual portfolio avg cost — the AI
    // doesn't know your real cost basis, so its netProfit can be wrong.
    const fees = state.settings.brokerage;
    const realisedPnl = (isReducing && avgCost != null && sellPrice != null)
      ? (sellPrice - avgCost) * qty - fees
      : null;
    // For BUY/TOP_UP: if AI netProfit is missing, compute from (target - entry_mid) * qty - round-trip fees
    let displayPnl;
    if (isReducing) {
      displayPnl = realisedPnl != null ? realisedPnl : r.netProfit;
    } else {
      if (r.netProfit != null) {
        displayPnl = r.netProfit;
      } else if (r.target && r.priceRange) {
        const entryMid = (Number(r.priceRange[0]) + Number(r.priceRange[1])) / 2;
        displayPnl = (r.target - entryMid) * qty - fees * 2; // round-trip brokerage
      } else {
        displayPnl = null;
      }
    }
    const pnlColor   = (displayPnl ?? 0) >= 0 ? '#16a34a' : '#dc2626';
    const pnlSign    = (displayPnl ?? 0) >= 0 ? '+ ' : '− ';

    // Top tiles differ by action type — sell-side recs get sell-oriented info.
    const topTiles = isReducing
      ? `
        ${tile('Sell at (limit)',
               `<span class="text-success">$${fmt(sellPrice)}</span>`,
               `${qty} share${qty===1?'':'s'} · stop if breaks $${fmt(r.stopLoss)}`)}
        ${tile('Cost basis (your avg)',
               avgCost != null ? `$${fmt(avgCost)} <span class="text-muted">× ${qty}</span>` : '<span class="text-muted">no holding</span>',
               avgCost != null ? `Holding ${heldQty} share${heldQty===1?'':'s'} · cost = $${fmt(avgCost*qty)}` : '—')}
        ${tile('Net realised P&L (est.)',
               `<span style="color:${pnlColor}">${displayPnl!=null?pnlSign+'$'+fmt(Math.abs(displayPnl)):'<span style="color:var(--text-tertiary)">—</span>'}</span>`,
               avgCost != null
                 ? `($${fmt(sellPrice)} − $${fmt(avgCost)}) × ${qty} − $${fees} fee`
                 : `AI estimate · cost basis unavailable`)}
      `
      : `
        ${tile('Entry range', `$${fmt(r.priceRange[0])} &ndash; $${fmt(r.priceRange[1])}`)}
        ${tile('Target / Stop-loss',

  ticker: '', action: 'all', status: 'all', outcome: 'all',
  dateFrom: '', dateTo: '', minConf: 0, sortBy: 'date_desc'
};

function applyRecHistoryFilter(hist) {
  const f = state.recHistoryFilter;
  if (f.ticker && !hist.ticker.includes(f.ticker.toUpperCase())) return false;
  if (f.action !== 'all' && hist.action !== f.action) return false;
  if (f.status !== 'all') {
    if (f.status === 'executed' && !hist.executed) return false;
    if (f.status === 'skipped' && hist.executed) return false;
  }
  if (f.outcome !== 'all' && (hist.outcome || 'open') !== f.outcome) return false;
  if (f.minConf > 0 && (hist.confidence || 0) < f.minConf / 100) return false;
  if (f.dateFrom) {
    // dateFrom is YYYY-MM-DD; hist.date is DD-MM-YYYY
    const [dd,mm,yyyy] = (hist.date||'').split('-');
    const histISO = `${yyyy}-${mm}-${dd}`;
    if (histISO < f.dateFrom) return false;
  }
  if (f.dateTo) {
    const [dd,mm,yyyy] = (hist.date||'').split('-');
    const histISO = `${yyyy}-${mm}-${dd}`;
    if (histISO > f.dateTo) return false;
  }
  return true;
}
