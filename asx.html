<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Trading Assistant</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f8f7;
    --bg-tertiary: #f1f0ec;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9b9b9b;
    --border-light: rgba(0,0,0,0.10);
    --border-medium: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1c1c;
      --bg-secondary: #242424;
      --bg-tertiary: #2a2a2a;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-tertiary: #666666;
      --border-light: rgba(255,255,255,0.08);
      --border-medium: rgba(255,255,255,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; font-size: 14px; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 220px; flex-shrink: 0; background: var(--bg-primary); border-right: 0.5px solid var(--border-light); display: flex; flex-direction: column; padding: 1.25rem 0; overflow-y: auto; }
  .sidebar-logo { padding: 0 1.25rem 1.5rem; border-bottom: 0.5px solid var(--border-light); margin-bottom: 1rem; }
  .sidebar-logo h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .sidebar-logo p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .nav-section { padding: 0 0.75rem; margin-bottom: 0.75rem; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 0.5rem; margin-bottom: 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius-md); cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; margin-bottom: 1px; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
  .nav-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .nav-item.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 500; }
  .nav-icon { font-size: 13px; width: 18px; text-align: center; }
  .server-indicator { margin: auto 1.25rem 0; padding-top: 1rem; border-top: 0.5px solid var(--border-light); }
  .server-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .server-dot.ok { background: #22c55e; }
  .server-dot.err { background: #ef4444; }
  .server-dot.checking { background: #f59e0b; animation: pulse 1s infinite; }

  /* Main */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.5rem; background: var(--bg-primary); border-bottom: 0.5px solid var(--border-light); flex-shrink: 0; gap: 12px; }
  .topbar h2 { font-size: 15px; font-weight: 600; }
  .market-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border-medium); color: var(--text-secondary); white-space: nowrap; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .content { padding: 1.5rem; flex: 1; }

  /* Cards */
  .card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.25rem; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.875rem; text-transform: uppercase; letter-spacing: 0.6px; }

  /* Metrics */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .metric-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 1rem; }
  .metric-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .metric-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

  /* Grid layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text-secondary); border-bottom: 0.5px solid var(--border-light); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 0.5px solid var(--border-light); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-secondary); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-buy { background: #dcfce7; color: #15803d; }
  .badge-sell { background: #fee2e2; color: #b91c1c; }
  .badge-hold { background: #fef9c3; color: #854d0e; }
  .badge-executed { background: #dbeafe; color: #1d4ed8; }
  .badge-skipped { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-open { background: #dbeafe; color: #1d4ed8; }
  .badge-closed { background: var(--bg-secondary); color: var(--text-secondary); }
  .badge-neutral { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  @media (prefers-color-scheme: dark) {
    .badge-buy { background: #14532d; color: #86efac; }
    .badge-sell { background: #7f1d1d; color: #fca5a5; }
    .badge-hold { background: #713f12; color: #fde68a; }
    .badge-executed { background: #1e3a5f; color: #93c5fd; }
    .badge-pending { background: #451a03; color: #fde68a; }
    .badge-open { background: #1e3a5f; color: #93c5fd; }
  }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-md); border: 0.5px solid var(--border-medium); background: transparent; color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: var(--font); white-space: nowrap; }
  .btn:hover { background: var(--bg-secondary); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
  .btn-primary:hover { opacity: 0.85; background: var(--text-primary); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { border-color: #ef4444; color: #ef4444; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-success { border-color: #22c55e; color: #15803d; }
  .btn-success:hover { background: #dcfce7; }

  /* Bars */
  .conf-bar { width: 80px; height: 5px; border-radius: 3px; background: var(--bg-secondary); overflow: hidden; display: inline-block; vertical-align: middle; }
  .conf-fill { height: 100%; border-radius: 3px; }
  .gauge-bar { height: 8px; border-radius: 4px; background: var(--bg-secondary); overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

  /* Indicator panel */
  .ind-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 0.5px solid var(--border-light); font-size: 12px; }
  .ind-row:last-child { border-bottom: none; }
  .ind-label { color: var(--text-secondary); }
  .ind-val { font-weight: 600; font-size: 12px; }

  /* Signal chips */
  .signal-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin: 2px; }
  .chip-buy  { background: #dcfce7; color: #15803d; }
  .chip-sell { background: #fee2e2; color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    .chip-buy  { background: #14532d; color: #86efac; }
    .chip-sell { background: #7f1d1d; color: #fca5a5; }
  }

  /* SR levels */
  .sr-level { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 3px; }
  .sr-r { background: #fee2e2; color: #b91c1c; }
  .sr-s { background: #dcfce7; color: #15803d; }
  .sr-p { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-medium); }
  @media (prefers-color-scheme: dark) {
    .sr-r { background: #7f1d1d; color: #fca5a5; }
    .sr-s { background: #14532d; color: #86efac; }
  }

  /* Mini chart canvas */
  canvas.sparkline { width: 100%; height: 60px; }
  .chart-container { position: relative; width: 100%; height: 180px; }
  canvas.price-chart { width: 100%; height: 180px; }

  /* Chat */
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 400px; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 12px; }
  .msg { max-width: 88%; padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.6; }
  .msg-user { align-self: flex-end; background: var(--text-primary); color: var(--bg-primary); border-radius: 10px 10px 2px 10px; }
  .msg-ai { align-self: flex-start; background: var(--bg-secondary); border: 0.5px solid var(--border-light); border-radius: 10px 10px 10px 2px; white-space: pre-wrap; }
  .chat-input-row { display: flex; gap: 8px; padding-top: 10px; border-top: 0.5px solid var(--border-light); margin-top: auto; }
  .chat-input-row input { flex: 1; }

  /* Loading */
  .loading-dots { display: inline-flex; gap: 4px; align-items: center; }
  .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); animation: bounce 1.2s infinite; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

  /* Forms */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 1rem; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  input[type="text"], input[type="number"], input[type="password"], textarea, select {
    padding: 7px 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-medium);
    background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 13px; width: 100%;
    transition: border-color 0.15s; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--text-primary); }
  textarea { resize: vertical; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 0.5px solid var(--border-light); }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); transition: all 0.15s; background: none; font-family: var(--font); margin-bottom: -0.5px; }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 500; }
  .tab:hover:not(.active) { color: var(--text-primary); background: var(--bg-secondary); }

  /* Signal row */
  .signal-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border-light); font-size: 13px; }
  .signal-row:last-child { border-bottom: none; }
  .sentiment-bar { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .sentiment-track { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-secondary); overflow: hidden; }
  .sentiment-fill { height: 100%; border-radius: 3px; }

  /* Toast */
  #toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { padding: 10px 14px; background: var(--bg-primary); border: 0.5px solid var(--border-medium); border-radius: var(--radius-md); font-size: 13px; pointer-events: all; animation: slideIn 0.2s ease; max-width: 300px; }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Rec card */
  .rec-card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 10px; }
  .rec-card:hover { border-color: var(--border-medium); }
  .rec-card.executed-card { border-left: 3px solid #3b82f6; }
  .rec-card.skipped-card { border-left: 3px solid var(--border-medium); opacity: 0.65; }

  /* Detail card */
  .detail-section { margin-bottom: 1.25rem; }
  .detail-section:last-child { margin-bottom: 0; }

  /* Color utilities */
  .up { color: #16a34a; } .down { color: #dc2626; }
  .text-success { color: #16a34a; } .text-danger { color: #dc2626; }
  .text-warn { color: #d97706; }
  .text-muted { color: var(--text-secondary); }
  .text-xs { font-size: 11px; color: var(--text-secondary); }
  .text-sm { font-size: 13px; }

  /* Layout utils */
  .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .mt-1 { margin-top: 0.5rem; } .mt-2 { margin-top: 1rem; }
  .mb-1 { margin-bottom: 0.5rem; } .mb-2 { margin-bottom: 1rem; }
  .section-gap { margin-bottom: 1.25rem; }
  .divider { border: none; border-top: 0.5px solid var(--border-light); margin: 1rem 0; }
  code { font-family: monospace; font-size: 12px; background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; }
  pre.code-block { font-family: monospace; font-size: 12px; background: var(--bg-secondary); padding: 12px; border-radius: var(--radius-md); color: var(--text-secondary); line-height: 1.6; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

  /* Empty state */
  .empty-state { text-align: center; padding: 3rem 2rem; }
  .empty-icon { font-size: 36px; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state p { color: var(--text-secondary); font-size: 14px; }
  .empty-state .sub { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }

  /* Schedule pills */
  .schedule-pill { padding: 5px 12px; border-radius: var(--radius-md); font-size: 12px; border: 0.5px solid var(--border-light); color: var(--text-secondary); white-space: nowrap; }
  .schedule-pill.past { border-color: #22c55e; color: #15803d; background: #dcfce7; }
  .schedule-pill.current { border-color: #3b82f6; color: #1d4ed8; background: #dbeafe; }
  @media (prefers-color-scheme: dark) {
    .schedule-pill.past { background: #14532d; color: #86efac; }
    .schedule-pill.current { background: #1e3a5f; color: #93c5fd; }
  }

  .info-banner { background: #fef3c7; border: 0.5px solid #fbbf24; border-radius: var(--radius-md); padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 1rem; }
  @media (prefers-color-scheme: dark) { .info-banner { background: #451a03; color: #fde68a; border-color: #92400e; } }

  .progress-ring { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--border-light); position: relative; font-size: 13px; font-weight: 700; }
</style>
</head>

async function refreshPrices() {
  if(!state.serverOk) { toast('Backend server not running. See Settings.','error'); return; }
  toast('Fetching live ASX prices...','info');
  let updated=0;
  for(const h of state.portfolio) {
    try {
      const r = await fetch(`${API}/api/quote/${h.ticker}`);
      if(!r.ok) continue;
      const d = await r.json();
      if(d.price) { h.currentPrice = d.price; updated++; }
    } catch {}
  }
  toast(`Updated ${updated} prices from yfinance`,'success');
  renderPage();
}

// ============================================================
// FETCH FULL INDICATOR DATA
// ============================================================
async function fetchSignals(tickers, forceRefresh=false) {
  if(!state.serverOk) return {};
  const now = Date.now();
  const stale = tickers.filter(t => forceRefresh || !state.lastSignalFetch[t] || (now - state.lastSignalFetch[t]) > 15*60*1000);
  if(!stale.length) return state.liveSignals;

  try {
    const r = await fetch(`${API}/api/analyse/batch`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tickers: stale, period:'6mo'})
    });
    if(!r.ok) return state.liveSignals;
    const data = await r.json();
    stale.forEach(t => {
      state.liveSignals[t] = data[t];
      state.lastSignalFetch[t] = now;
    });
  } catch {}
  return state.liveSignals;
}

// ============================================================
function drawSparkline(canvasId, data, color='#3b82f6') {
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || canvas.width;
  const h = canvas.offsetHeight || canvas.height;
  canvas.width = w; canvas.height = h;
  if(!data || data.length<2) return;
  const prices = data.map(d=>d.close);
  const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, color+'44');
  grad.addColorStop(1, color+'00');
  ctx.beginPath();
  prices.forEach((p,i)=>{
    const x=(i/(prices.length-1))*w, y=h-((p-min)/range)*(h-8)-4;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grad;
  ctx.fill();
}

// ============================================================
// PRICE CHART
// ============================================================
function drawPriceChart(canvasId, chartData, sma20, sma50, bbUpper, bbLower) {
  const canvas = document.getElementById(canvasId);
  if(!canvas || !chartData?.length) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth; const h = canvas.height = 180;
  canvas.width = w;
  const prices = chartData.map(d=>d.close);
  const allVals = [...prices];
  if(sma20) allVals.push(sma20);
  if(bbUpper) allVals.push(bbUpper);
  if(bbLower) allVals.push(bbLower);
  const min=Math.min(...allVals)-Math.min(...allVals)*0.01, max=Math.max(...allVals)+Math.max(...allVals)*0.01;
  const range=max-min||1;
  const px=(v) => h-((v-min)/range)*h;
  const py=(i) => (i/(chartData.length-1))*(w-8)+4;

  ctx.clearRect(0,0,w,h);

  // BB fill
  if(bbUpper && bbLower) {
    ctx.beginPath();
    chartData.forEach((_,i)=>{ const x=py(i); i===0?ctx.moveTo(x,px(bbUpper)):ctx.lineTo(x,px(bbUpper)); });
    chartData.slice().reverse().forEach((_,i)=>{ const ii=chartData.length-1-i; ctx.lineTo(py(ii),px(bbLower)); });
    ctx.closePath();
    ctx.fillStyle='rgba(59,130,246,0.07)';
    ctx.fill();
  }

  // Price line
  ctx.beginPath();
  chartData.forEach((d,i)=>{ const x=py(i),y=px(d.close); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1.5; ctx.stroke();

  // SMA20
  if(sma20) {
    ctx.beginPath(); ctx.moveTo(4,px(sma20));
    chartData.forEach((_,i)=>ctx.lineTo(py(i),px(sma20)));
    ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function handleCSV(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.trim().split('\n').slice(1);
    let added=0;
    lines.forEach(line=>{
      const [ticker,shares,avg]=line.split(',').map(s=>s.trim());
      if(ticker&&shares&&avg){
        const idx=state.portfolio.findIndex(h=>h.ticker===ticker.toUpperCase());
        const entry={ticker:ticker.toUpperCase(),shares:Number(shares),avgPrice:Number(avg),currentPrice:Number(avg),sector:'Other'};
        if(idx>=0) state.portfolio[idx]=entry; else state.portfolio.push(entry);
        added++;
      }
    });
    toast(`Imported ${added} holdings — click Refresh Prices for live data`,'success');
    renderPage();
  };
  reader.readAsText(file);
}
function addHolding() {
  const ticker=prompt('Ticker (e.g. NAB):'); if(!ticker) return;
  const shares=Number(prompt('Shares:')); if(!shares) return;
  const avg=Number(prompt('Avg buy price ($):')); if(!avg) return;
  const sector=prompt('Sector:') || 'Other';
  state.portfolio.push({ticker:ticker.toUpperCase(),shares,avgPrice:avg,currentPrice:avg,sector});
  toast('Added — click Refresh Prices to get live price','success'); renderPage();
}
function removeHolding(i) {
  if(!confirm(`Remove ${state.portfolio[i].ticker}?`)) return;
  state.portfolio.splice(i,1); renderPage();
}

async function runMacroAnalysis() {
  const key=getApiKey();
  if(!key){toast('Add API key in Settings','error');showPage('settings');return;}
  toast('Generating AI macro brief...','info');

  // First fetch live data if available
  let liveCtx='';
  if(state.serverOk) {
    try {
      const r=await fetch(`${API}/api/macro`);
      if(r.ok) {
        const d=await r.json();
        state.macroData={...d, _source:'live'};
        const lines=[];
        if(d.sp500) lines.push(`S&P500: ${fmt(d.sp500.value)} (${fmtp(d.sp500.change_pct)})`);
        if(d.asx200) lines.push(`ASX200: ${fmt(d.asx200.value)} (${fmtp(d.asx200.change_pct)})`);
        if(d.gold) lines.push(`Gold: ${fmt(d.gold.value)} (${fmtp(d.gold.change_pct)})`);
        if(d.aud_usd) lines.push(`AUD/USD: ${fmt(d.aud_usd.value,4)} (${fmtp(d.aud_usd.change_pct)})`);
        if(d.vix) lines.push(`VIX: ${fmt(d.vix.value)}`);
        liveCtx = lines.join(' | ');
      }
    } catch {}
  }

  const system=`You are a macro analyst for Australian equity markets. Return ONLY valid JSON, no markdown.
Format: {"sentiment":"risk-on"|"risk-off","sentimentConf":0-1,"bullish":0-100,"analysis":"3 paragraph analysis","keyDrivers":"key market drivers today"}`;
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:[{role:'user',content:`Provide current macro analysis for ASX morning brief. Today: ${todayStr()}${liveCtx?'. Live market data: '+liveCtx:'. Use realistic current estimates.'}  Return only JSON.`}]})});
    const data=await r.json();
    if(data.error) throw new Error(data.error.message);
    const text=data.content?.[0]?.text||'{}';
    const ai=JSON.parse(text.replace(/```json|```/g,'').trim());
    state.macroData={...state.macroData, ...ai, _source:'ai'};
    toast('AI macro brief ready','success'); renderPage();
  } catch(e) {
    toast('Macro error: '+e.message,'error');
  }
}

function drawSparklineFromData(ticker, s) {
  const canvas=document.getElementById(`chart-${ticker}`);
  if(!canvas||!s.chart_data?.length) return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||800;
  canvas.height=180;
  const w=canvas.width, h=canvas.height;
  const data=s.chart_data;
  const prices=data.map(d=>d.close);
  const allV=[...prices];
  if(s.bb_upper) allV.push(s.bb_upper);
  if(s.bb_lower) allV.push(s.bb_lower);
  const mn=Math.min(...allV)*0.998, mx=Math.max(...allV)*1.002, rng=mx-mn||1;
  const px=v=>h-((v-mn)/rng)*(h-20)-10;
  const py=i=>(i/(data.length-1))*(w-20)+10;

  ctx.clearRect(0,0,w,h);

  // Grid lines
  ctx.strokeStyle='rgba(128,128,128,0.1)'; ctx.lineWidth=0.5;
  [0.25,0.5,0.75].forEach(f=>{ ctx.beginPath(); ctx.moveTo(0,h*f); ctx.lineTo(w,h*f); ctx.stroke(); });

  // BB bands
  if(s.bb_upper&&s.bb_lower) {
    ctx.beginPath();
    data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.bb_upper)):ctx.lineTo(py(i),px(s.bb_upper)));
    data.slice().reverse().forEach((_,i)=>ctx.lineTo(py(data.length-1-i),px(s.bb_lower)));
    ctx.closePath(); ctx.fillStyle='rgba(59,130,246,0.06)'; ctx.fill();
    // BB lines
    ctx.setLineDash([2,3]); ctx.strokeStyle='rgba(59,130,246,0.4)'; ctx.lineWidth=1;
    ['bb_upper','bb_lower'].forEach(k=>{ ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s[k])):ctx.lineTo(py(i),px(s[k]))); ctx.stroke(); });
    ctx.setLineDash([]);
  }

  // SMA lines
  if(s.sma_20) { ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.sma_20)):ctx.lineTo(py(i),px(s.sma_20))); ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]); }
  if(s.sma_50) { ctx.beginPath(); data.forEach((_,i)=>i===0?ctx.moveTo(py(i),px(s.sma_50)):ctx.lineTo(py(i),px(s.sma_50))); ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]); }

  // Price line with gradient fill
  const grad=ctx.createLinearGradient(0,0,0,h);
  const isUp=prices[prices.length-1]>=prices[0];
  grad.addColorStop(0, isUp?'rgba(22,163,74,0.15)':'rgba(220,38,38,0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  data.forEach((d,i)=>i===0?ctx.moveTo(py(i),px(d.close)):ctx.lineTo(py(i),px(d.close)));
  ctx.strokeStyle=isUp?'#16a34a':'#dc2626'; ctx.lineWidth=2; ctx.stroke();
  ctx.lineTo(w-10,h); ctx.lineTo(10,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

  // Current price label
  const cp=prices[prices.length-1];
  ctx.fillStyle=isUp?'#16a34a':'#dc2626';
  ctx.font='11px sans-serif';
  ctx.textAlign='right';
  ctx.fillText(`$${cp.toFixed(3)}`, w-12, px(cp)-4);

  // Legend
  ctx.font='10px sans-serif'; ctx.textAlign='left';
  const leg=[['─ Price',isUp?'#16a34a':'#dc2626'],['-- SMA20','#f59e0b'],['-- SMA50','#8b5cf6'],['~~ BB','#3b82f6']];
  leg.forEach(([l,c],i)=>{ ctx.fillStyle=c; ctx.fillText(l,10+i*85,14); });
}

function showTickerDetail(ticker) {
  document.querySelectorAll('[id^="detail-"]').forEach(el=>el.style.display='none');
  const el=document.getElementById(`detail-${ticker}`);
  if(el) { el.style.display='block'; el.scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>{ const s=state.liveSignals[ticker]; if(s&&!s.error&&s.chart_data) drawSparklineFromData(ticker, s); },100); }
}

function markExecuted(id) {
  const rec=state.recommendations.find(r=>r.id===id); if(!rec) return;

  rec.status='executed'; rec.executedAt=time;
  state.recHistory.unshift({id:rec.id,date:todayStr(),ticker:rec.ticker,action:rec.action,confidence:rec.confidence,priceRange:rec.priceRange,target:rec.target,stopLoss:rec.stopLoss,expectedProfit:rec.expectedProfit,netProfit:rec.netProfit,executed:true,executedAt:time,outcome:'open',actualProfit:null});
  state.tradeJournal.unshift({id:state.tradeJournal.length+1,date:todayStr(),ticker:rec.ticker,action:rec.action,qty:rec.qty||10,entryPrice:rec.priceRange[0],exitPrice:null,fees:state.settings.brokerage,status:'open',pnl:null,recId:rec.id,recExecuted:true,timestamp:time});
  toast(`${rec.ticker} marked EXECUTED at ${time}`,'success'); renderPage();
}
function markSkipped(id) {
  const rec=state.recommendations.find(r=>r.id===id); if(!rec) return;

}

function addManualTrade() {
  const ticker=prompt('Ticker:'); if(!ticker) return;

  const qty=Number(prompt('Quantity:')); if(!qty) return;
  const price=Number(prompt('Price ($):')); if(!price) return;
  state.tradeJournal.unshift({id:state.tradeJournal.length+1,date:todayStr(),ticker:ticker.toUpperCase(),action,qty,entryPrice:price,exitPrice:null,fees:state.settings.brokerage,status:'open',pnl:null,recId:null,recExecuted:false,timestamp:nowSydney()});

}
function exportCSV() {
  const h='Date,Time,Ticker,Action,Qty,Entry,Exit,Fees,PnL,Status,RecID,FromRec\n';
  const rows=state.tradeJournal.map(t=>[t.date,t.timestamp||'',t.ticker,t.action,t.qty,t.entryPrice,t.exitPrice||'',t.fees,t.pnl||'',t.status,t.recId||'',t.recId?(t.recExecuted?'Yes':'No'):'Manual'].join(',')).join('\n');
  const blob=new Blob([h+rows],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`asx_trades_${todayStr()}.csv`; a.click();
  toast('CSV exported','success');
}

function renderPerformance() {
  const exec=state.recHistory.filter(r=>r.executed);
  const wins=state.recHistory.filter(r=>r.outcome==='win').length;
  const losses=state.recHistory.filter(r=>r.outcome==='loss').length;
  const total=wins+losses;
  const winRate=total?wins/total*100:0;
  const execRate=state.recHistory.length?exec.length/state.recHistory.length*100:0;
  const totalFees=state.tradeJournal.reduce((s,t)=>s+t.fees,0);
  const realised=state.tradeJournal.filter(t=>t.pnl!=null).reduce((s,t)=>s+t.pnl,0);
  const skipped=state.recHistory.filter(r=>!r.executed);
  const confBuckets=[0.5,0.6,0.7,0.8,0.9].map(c=>{
    const b=state.recHistory.filter(r=>r.confidence>=c&&r.confidence<c+0.1&&r.outcome!=='open'&&r.outcome!=='skipped');
    const w=b.filter(r=>r.outcome==='win').length;
    return {conf:fmt(c*100,0)+'%',wins:w,total:b.length,rate:b.length?w/b.length:null};
  });
  return `
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">Win Rate</div><div class="metric-value ${winRate>=50?'up':'down'}">${fmt(winRate,0)}%</div><div class="metric-sub">${wins}W / ${losses}L</div></div>
      <div class="metric-card"><div class="metric-label">Execution Rate</div><div class="metric-value">${fmt(execRate,0)}%</div><div class="metric-sub">${exec.length} of ${state.recHistory.length} recs</div></div>
      <div class="metric-card"><div class="metric-label">Realised P&L</div><div class="metric-value ${realised>=0?'up':'down'}">${sign(realised)}$${fmt(Math.abs(realised))}</div></div>
      <div class="metric-card"><div class="metric-label">Fees Paid</div><div class="metric-value">$${fmt(totalFees)}</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Confidence Calibration</div>
        <p class="text-xs text-muted mb-1">Predicted confidence vs actual win rate.</p>
        ${confBuckets.map(b=>`
          <div class="signal-row">
            <span class="text-sm">${b.conf} confidence</span>
            ${b.total>0?`<div class="flex-row"><div class="conf-bar" style="width:100px"><div class="conf-fill" style="width:${b.rate*100}%;background:${confColor(b.rate)}"></div></div><span class="text-xs">${fmt(b.rate*100,0)}% actual (${b.total} trades)</span></div>`:'<span class="text-xs text-muted">No data</span>'}
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">Recommendation Outcomes</div>
        ${[['Executed & Won',state.recHistory.filter(r=>r.executed&&r.outcome==='win').length,'#22c55e'],
           ['Executed & Lost',state.recHistory.filter(r=>r.executed&&r.outcome==='loss').length,'#ef4444'],
           ['Executed (Open)',state.recHistory.filter(r=>r.executed&&r.outcome==='open').length,'#3b82f6'],
           ['Skipped',skipped.length,'#9ca3af']].map(([l,c,col])=>`
          <div class="signal-row">
            <div class="flex-row"><div style="width:10px;height:10px;border-radius:2px;background:${col};flex-shrink:0"></div><span class="text-sm">${l}</span></div>
            <strong>${c}</strong>
          </div>`).join('')}
        <div class="divider"></div>
        <div class="signal-row"><span class="text-sm text-muted">Net after all costs</span><strong class="${realised-totalFees>=0?'text-success':'text-danger'}">${sign(realised-totalFees)}$${fmt(Math.abs(realised-totalFees))}</strong></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Cost Breakdown</div>
      <div class="grid-3" style="gap:8px">
        <div style="background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-md)"><div class="text-xs">Total brokerage</div><div style="font-size:18px;font-weight:600">$${fmt(totalFees)}</div></div>
        <div style="background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-md)"><div class="text-xs">API costs (est.)</div><div style="font-size:18px;font-weight:600">$${fmt(state.recHistory.length*state.settings.apiCostPerRun,2)}</div></div>
        <div style="background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-md)"><div class="text-xs">Net after costs</div><div style="font-size:18px;font-weight:600;color:${realised-totalFees>=0?'#16a34a':'#dc2626'}">${sign(realised-totalFees)}$${fmt(Math.abs(realised-totalFees))}</div></div>
      </div>
    </div>
  `;

async function sendChat() {
  const input=document.getElementById('chat-input');
  const msg=input.value.trim(); if(!msg) return;
  const key=getApiKey();
  if(!key) { toast('Add API key in Settings','error'); return; }
  input.value='';
  state.chatHistory.push({role:'user',content:msg});
  const msgs=document.getElementById('chat-messages');
  msgs.innerHTML+=`<div class="msg msg-user">${msg}</div>`;
  msgs.innerHTML+=`<div class="msg msg-ai" id="typing"><div class="loading-dots"><span></span><span></span><span></span></div></div>`;
  msgs.scrollTop=msgs.scrollHeight;

  // Build indicator context from live signals
  const ps=state.portfolio.map(h=>`${h.ticker}(${h.shares}sh@$${h.currentPrice}, cost $${h.avgPrice})`).join(', ');
  let indicatorCtx='';
  const loadedTickers=Object.keys(state.liveSignals).filter(t=>!state.liveSignals[t]?.error);
  if(loadedTickers.length) {
    indicatorCtx='\n\nLive Technical Indicators:\n'+loadedTickers.map(t=>{
      const s=state.liveSignals[t];
      return `${t}: RSI14=${s.rsi_14?.toFixed(1)}, MACD=${s.macd_hist?.toFixed(3)}, Signal=${s.composite_signal}, Conf=${(s.confidence*100).toFixed(0)}%, Trend=${s.trend_direction}, ADX=${s.adx?.toFixed(1)}, BB%B=${s.bb_pct_b!=null?(s.bb_pct_b*100).toFixed(0)+'%':'n/a'}, SMA20=$${s.sma_20?.toFixed(3)}, MFI=${s.mfi?.toFixed(1)}, ATR=${s.atr_14?.toFixed(3)}`;
    }).join('\n');
  }

  const system=`You are an expert ASX (Australian Stock Exchange) trading assistant. You support human traders who manually execute trades. Never suggest auto-trading. Be concise, cost-aware, and always mention risks and brokerage impact.

Portfolio: ${ps}
Cash: $${fmt(state.cash)}
Brokerage: $${state.settings.brokerage}/trade | Min trade: $${state.settings.minTradeSize} | Max daily: ${state.settings.maxTradesPerDay} trades${indicatorCtx}

When making recommendations, always include: entry range, target, stop-loss, expected net profit after brokerage ($${state.settings.brokerage}), key risks, and which indicators support the view. Use the live indicator data above when answering ticker-specific questions.`;

  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system,messages:state.chatHistory.map(m=>({role:m.role,content:m.content}))})});
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message);
    const reply=data.content?.[0]?.text||'No response.';
    state.chatHistory.push({role:'assistant',content:reply});
    document.getElementById('typing').outerHTML=`<div class="msg msg-ai" style="white-space:pre-wrap">${reply}</div>`;
  } catch(err) {
    document.getElementById('typing').outerHTML=`<div class="msg msg-ai text-danger">Error: ${err.message}</div>`;
  }
  msgs.scrollTop=msgs.scrollHeight;
}

  SMA20=$${s.sma_20?.toFixed(3)}, SMA50=${s.sma_50?'$'+s.sma_50.toFixed(3):'n/a'}, ADX=${s.adx?.toFixed(1)}(${s.trend_strength})
  BB: Upper=$${s.bb_upper?.toFixed(3)}, Mid=$${s.bb_mid?.toFixed(3)}, Lower=$${s.bb_lower?.toFixed(3)}, %B=${s.bb_pct_b!=null?(s.bb_pct_b*100).toFixed(0)+'%':'n/a'}
  ATR=$${s.atr_14?.toFixed(3)}(${s.atr_pct?.toFixed(1)}%), VolRatio=${s.volume_ratio?.toFixed(2)}x, OBV=${s.obv_trend}
  S/R: R1=$${sr?.r1?.toFixed(3)}, Pivot=$${sr?.pivot?.toFixed(3)}, S1=$${sr?.s1?.toFixed(3)}
  Returns: 1D=${s.return_1d?.toFixed(2)}%, 5D=${s.return_5d?.toFixed(2)}%, 20D=${s.return_20d?.toFixed(2)}%
  Fundamentals: PE=${s.fundamentals?.pe_ratio?.toFixed(1)||'n/a'}, DivYield=${s.fundamentals?.dividend_yield?(s.fundamentals.dividend_yield*100).toFixed(2)+'%':'n/a'}, Beta=${s.fundamentals?.beta?.toFixed(2)||'n/a'}`;
    }).join('\n');
  }

  const pj=JSON.stringify(state.portfolio.map(h=>({ticker:h.ticker,shares:h.shares,avgPrice:h.avgPrice,currentPrice:h.currentPrice,sector:h.sector})));
  const system=`You are a conservative ASX trading assistant with access to real-time yfinance technical indicators. Generate structured trade recommendations. Be cost-aware and disciplined.
RULES: Brokerage $${state.settings.brokerage}/trade | API cost $${fmt(state.settings.apiCostPerRun,3)} | Min trade $${state.settings.minTradeSize} | Max ${state.settings.maxTradesPerDay} trades/day | Min confidence 0.55
Only recommend if: expectedProfit > (brokerage + apiCost + $15 safety margin).
Base recommendations on the REAL indicator data provided. Do NOT invent signals.
Return ONLY a valid JSON array (empty [] if no quality trades). Each item:
{"ticker":string,"action":"BUY"|"SELL"|"HOLD","sector":string,"priceRange":[low,high],"target":number,"stopLoss":number,"qty":number,"confidence":0-1,"expectedProfit":number,"brokerageCost":${state.settings.brokerage},"apiCost":${state.settings.apiCostPerRun},"netProfit":number,"reasoning":string,"risks":string,"signals":string[]}`;

  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system,messages:[{role:'user',content:`Analyse these ASX holdings and generate trade recommendations:\n${pj}\nCash: $${state.cash}\nDate: ${todayStr()}${indicatorCtx}\nReturn JSON array only.`}]})});
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message);
    const text=data.content?.[0]?.text||'[]';
    const recs=JSON.parse(text.replace(/```json|```/g,'').trim());
    const newRecs=recs.map((r,i)=>({...r,id:`R-${Date.now()}-${i}`,status:'pending',generatedAt:nowSydney(),date:todayStr()}));
    state.recommendations=[...newRecs,...state.recommendations.filter(r=>r.status==='pending')];
    state.analysisRunning=false;
    toast(`Analysis done: ${newRecs.length} recommendation(s) based on live indicators`,'success');
    showPage('recommendations');
  } catch(e) {
    state.analysisRunning=false;
    toast('Analysis error: '+e.message,'error');
  }
}

// ============================================================
// SETTINGS
// ============================================================
function renderSettings() {
  const key=getApiKey();
  return `
    <div class="grid-2">
      <div class="card">
        <div class="card-title">API Key</div>
        <div class="form-row">
          <div class="form-label">Anthropic API Key</div>
          <input type="password" id="api-key-input" value="${key}" placeholder="sk-ant-...">
          <div class="text-xs text-muted mt-1">Required for AI analysis and assistant. Stored in browser localStorage.</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="saveApiKey()">Save API Key</button>
      </div>
      <div class="card">
        <div class="card-title">Trading Parameters</div>
        ${[['Brokerage per trade ($)','brokerage','number'],['Min trade size ($)','minTradeSize','number'],['Max trades per day','maxTradesPerDay','number'],['Max position size (%)','maxPositionPct','number'],['API cost per run ($)','apiCostPerRun','number']].map(([l,k,t])=>`
          <div class="form-row">
            <div class="form-label">${l}</div>
            <input type="${t}" value="${state.settings[k]}" onchange="updateSetting('${k}',this.value)">
          </div>`).join('')}
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Backend Server (yfinance)</div>
        <div class="form-row">
          <div class="form-label">Server URL</div>
          <input type="text" value="${state.settings.serverUrl||'http://localhost:5000'}" onchange="updateSetting('serverUrl',this.value)">
        </div>
        <div class="flex-row mt-1">
          <button class="btn btn-sm" onclick="checkServer().then(renderPage)">Test Connection</button>
          <span class="text-xs ${state.serverOk?'text-success':'text-danger'}">${state.serverOk?'✓ Connected':'✗ Not connected'}</span>
        </div>
        <div class="mt-2">
          <div class="card-title" style="margin-bottom:6px">Setup Instructions</div>
          <pre class="code-block">pip install yfinance flask flask-cors pandas numpy
python3 asx_server.py</pre>
          <div class="text-xs text-muted mt-1">Run in same folder as this HTML file. Requires internet access for yfinance.</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Capital Mode</div>
        <div class="form-row">
          <div class="form-label">Trading capital mode</div>
          <select onchange="updateSetting('capitalMode',this.value)">
            <option value="full" ${state.settings.capitalMode==='full'?'selected':''}>Trade full capital</option>
            <option value="partial" ${state.settings.capitalMode==='partial'?'selected':''}>Trade partial capital (risk-based)</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-label">Risk capital % per trade</div>
          <input type="number" value="${state.settings.riskCapitalPct}" onchange="updateSetting('riskCapitalPct',this.value)">
        </div>
        <div class="form-row">
          <div class="form-label">Cash balance ($)</div>
          <input type="number" value="${state.cash}" onchange="state.cash=Number(this.value)">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Analysis Schedule (Sydney Time)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${['08:00 — Morning macro brief','10:00 — Analysis run 1','11:00 — Analysis run 2','12:00 — Analysis run 3','13:00 — Analysis run 4','14:00 — Analysis run 5','15:00 — Analysis run 6','15:45 — Final run (pre-close)'].map(t=>`<div class="schedule-pill">${t}</div>`).join('')}
      </div>
    </div>
  `;
}
function saveApiKey() {
  const val=document.getElementById('api-key-input').value.trim();
  if(!val){toast('Enter a valid API key','error');return;}
  state.settings.apiKey=val;
  localStorage.setItem('asx_api_key',val);
  toast('API key saved','success');
}
function updateSetting(key,value) {
  state.settings[key]=isNaN(Number(value))?value:Number(value);
  toast('Setting updated','success');
}

// Init
renderPage();
</script>
</body>
</html>
