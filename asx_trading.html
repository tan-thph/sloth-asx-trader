<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Trading Assistant</title>
<link rel="stylesheet" href="asx_trading.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }</script>
</head>
<body>

<div id="toast-container"></div>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <h1>ASX Trader</h1>
      <p>Decision Support v2.0</p>
    </div>
    <div class="nav-section">
      <div class="nav-label">Overview</div>
      <button class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">⬡</span> Dashboard</button>
      <button class="nav-item" onclick="showPage('portfolio')"><span class="nav-icon">⬢</span> Portfolio</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Analysis</div>
      <button class="nav-item" onclick="showPage('macro')"><span class="nav-icon">◎</span> Morning Macro</button>
      <button class="nav-item" onclick="showPage('recommendations')"><span class="nav-icon">◆</span> Recommendations</button>
      <button class="nav-item" onclick="showPage('day-trading')"><span class="nav-icon">◈</span> Day Trading</button>
      <button class="nav-item" onclick="showPage('signals')"><span class="nav-icon">◇</span> Live Signals</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Records</div>
      <button class="nav-item" onclick="showPage('journal')"><span class="nav-icon">▣</span> Trade Journal</button>
      <button class="nav-item" onclick="showPage('performance')"><span class="nav-icon">▤</span> Performance</button>
      <button class="nav-item" onclick="showPage('history')"><span class="nav-icon">▥</span> Value History</button>
      <button class="nav-item" onclick="showPage('cgt')"><span class="nav-icon">◈</span> CGT Parcels</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Tools</div>
      <button class="nav-item" onclick="showPage('backtest')"><span class="nav-icon">▷</span> Backtesting</button>
      <button class="nav-item" onclick="showPage('risk')"><span class="nav-icon">◎</span> Risk Dashboard</button>
      <button class="nav-item" onclick="showPage('assistant')"><span class="nav-icon">◉</span> AI Assistant</button>
      <button class="nav-item" onclick="showPage('news')"><span class="nav-icon">◈</span> News Scanner</button>
      <button class="nav-item" onclick="showPage('announcements')"><span class="nav-icon">▶</span> Announcements</button>
      <button class="nav-item" onclick="showPage('scanner')"><span class="nav-icon">⬡</span> Market Scanner</button>
      <button class="nav-item" onclick="showPage('watchlist')"><span class="nav-icon">⭐</span> Watchlist</button>
      <button class="nav-item" onclick="showPage('learning')"><span class="nav-icon">⊕</span> Learning Loop</button>
      <button class="nav-item" onclick="showPage('settings')"><span class="nav-icon">⊙</span> Settings</button>
    </div>
    <div class="server-indicator">
      <div class="flex-row" style="font-size:11px;color:var(--text-secondary)">
        <span class="server-dot checking" id="srv-dot"></span>
        <span id="srv-label">Connecting...</span>
      </div>
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:3px">localhost:5000 · yfinance</div>
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px" id="db-label">💾 DB: —</div>
    </div>
  </nav>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
  <div class="main">
    <div class="topbar">
      <div class="flex-row" style="gap:10px">
        <button class="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Open navigation">☰</button>
        <h2 id="page-title">Dashboard</h2>
      </div>
      <div class="flex-row">
        <button class="btn btn-sm" id="sbc-mode-btn" onclick="toggleSbcMode()" title="Toggle SBC mode — single board computer (Jetson Orin, RPi 5): 20min refresh, no auto-scan">⬡ PC</button>
        <div class="market-pill"><div class="live-dot"></div><span id="market-time">ASX Loading...</span></div>
        <button class="btn btn-sm" onclick="refreshPrices()">⟳ Refresh Prices</button>
        <button class="btn btn-primary btn-sm" onclick="runAnalysis()">▶ Run Analysis</button>
        <div class="notif-bell-wrap" id="notif-bell-wrap">
          <button class="btn btn-sm notif-bell-btn" id="notif-bell-btn" onclick="toggleNotifPanel()" title="Notifications" aria-label="Notifications">
            🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span>
          </button>
          <div class="notif-panel" id="notif-panel" style="display:none;flex-direction:column"></div>
        </div>
      </div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/regime-engine.js"></script>
<script src="js/learning-loop.js"></script>
<script src="js/quant-engine.js"></script>
<script src="js/api.js"></script>
<script src="js/portfolio-helpers.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/reconcile.js"></script>
<script src="js/prices.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/portfolio.js"></script>
<script src="js/pages/macro.js"></script>
<script src="js/pages/signals.js"></script>
<script src="js/pages/recommendations.js"></script>
<script src="js/pages/journal.js"></script>
<script src="js/pages/cgt.js"></script>
<script src="js/pages/performance.js"></script>
<script src="js/pages/backtest.js"></script>
<script src="js/pages/risk.js"></script>
<script src="js/pages/assistant.js"></script>
<script src="js/prompts.js"></script>
<script src="js/prompt-modules.js"></script>
<script src="js/claude-client.js"></script>
<script src="js/debate-client.js"></script>
<script src="js/response-validator.js"></script>
<script src="js/analysis.js"></script>
<script src="js/asx-universe.js"></script>
<script src="js/strategy.js"></script>
<script src="js/intraday-strategy.js"></script>
<script src="js/day-trading-analysis.js"></script>
<script src="js/pages/day-trading.js"></script>
<script src="js/pages/news.js"></script>
<script src="js/pages/announcements.js"></script>
<script src="js/pages/scanner.js"></script>
<script src="js/pages/watchlist.js"></script>
<script src="js/pages/compare.js"></script>
<script src="js/pages/learning.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/alerts.js"></script>
<script src="js/navigation.js"></script>
<script src="js/init.js"></script>
<!-- original monolithic script block replaced with separate files above -->

</body>
</html>
